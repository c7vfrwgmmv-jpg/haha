function getAllTripsForRoute() {
  if (!state.selectedRoute || !state.gtfsData || !state.selectedDate) return [];

  let routeIds = [state.selectedRoute.route_id];
  if (state.selectedRouteGroup && Array.isArray(state.selectedRouteGroup.members)) {
    routeIds = state.selectedRouteGroup.members
      .map(r => r.route_id)
      .filter(Boolean);
  }

  let routeTrips = [];
  routeIds.forEach(rid => {
    const arr = state.gtfsData.tripsIndex[rid] || [];
    routeTrips = routeTrips.concat(arr);
  });

  routeTrips = routeTrips.filter(t => (t.direction_id || '0') === state.selectedDirection);
  const activeServices = getServicesForDate(state.selectedDate);
  return routeTrips.filter(t => activeServices.includes(t.service_id));
}

function computeVariantsForRoute() {
  if (!state.selectedRoute || !state.gtfsData || !state.selectedDate) return null;
  const trips = getAllTripsForRoute();
  if (trips.length === 0) return null;

  const tripStopMaps = {};
  
  trips.forEach(trip => {
    const stopTimes = state.gtfsData.stopTimesIndex[trip.trip_id] || [];
    stopTimes.sort((a,b) => parseInt(a.stop_sequence || '0') - parseInt(b.stop_sequence || '0'));
    tripStopMaps[trip.trip_id] = stopTimes;
  });

  const patternCounts = new Map();
  const tripToPatternKey = new Map();

  trips.forEach(trip => {
    const stops = tripStopMaps[trip.trip_id] || [];
    
    const patternKey = stops.map(st => 
        getStationId(st.stop_id, state.gtfsData.stopsIndex)
    ).join(',');

    tripToPatternKey.set(trip.trip_id, patternKey);
    
    const currentCount = patternCounts.get(patternKey) || 0;
    patternCounts.set(patternKey, currentCount + 1);
  });

  const sortedPatterns = Array.from(patternCounts.entries())
    .sort((a, b) => b[1] - a[1])
    .map(entry => entry[0]);

  const patternToVariant = {};
  sortedPatterns.forEach((key, index) => {
    patternToVariant[key] = index + 1;
  });

  const tripToVariant = {}; 
  const variantRealStops = {}; 

  trips.forEach(trip => {
    const pKey = tripToPatternKey.get(trip.trip_id);
    const vNum = patternToVariant[pKey];
    
    tripToVariant[trip.trip_id] = vNum;

    if (!variantRealStops[vNum]) {
       const stops = tripStopMaps[trip.trip_id];
       variantRealStops[vNum] = stops.map(s => s.stop_id);
    }
  });

  const variantDetails = {};
  Object.keys(variantRealStops).forEach(vNum => {
    const stopIds = variantRealStops[vNum];
    variantDetails[vNum] = { 
        stops: stopIds, 
        stopDetails: stopIds.map(id => state.gtfsData.stopsIndex[id]) 
    };
  });

  return { trips, tripStopMaps, tripToVariant, patternToVariant, variantDetails };
}

// ── VARIANT CLUSTERING ────────────────────────────────────────────────────────
const BUS_CLUSTER_MIN_VARIANTS    = 13;
const BUS_CLUSTER_JACCARD_THRESHOLD = 0.45;

const isBusRoute = r => ['bus','coach','trolleybus'].includes(canonicalFromCode(r?.route_type));

const isSubsequence = (seqA, seqB) => {
  let i = 0;
  for (let j = 0; j < seqB.length && i < seqA.length; j++) {
    if (seqA[i] === seqB[j]) i++;
  }
  return i === seqA.length;
};

const jaccardSim = (seqA, seqB) => {
  const setA = new Set(seqA);
  const setB = new Set(seqB);
  let isect = 0; setA.forEach(x => { if (setB.has(x)) isect++; });
  const union = setA.size + setB.size - isect;
  if (union === 0) return 1;
  const jaccard = isect / union;
  if (jaccard === 0 || isect < 2) return jaccard;

  const commonA = seqA.filter(x => setB.has(x));
  const commonB = seqB.filter(x => setA.has(x));

  let concordant = 0, discordant = 0;
  const posB = new Map(commonB.map((x, i) => [x, i]));
  for (let i = 0; i < commonA.length - 1; i++) {
    for (let j = i + 1; j < commonA.length; j++) {
      const pi = posB.get(commonA[i]);
      const pj = posB.get(commonA[j]);
      if (pi === undefined || pj === undefined) continue;
      if (pi < pj) concordant++; else discordant++;
    }
  }
  const total = concordant + discordant;
  if (total === 0) return jaccard;
  if ((concordant - discordant) / total < 0) return 0;

  const [shorter, longer] = seqA.length <= seqB.length ? [seqA, seqB] : [seqB, seqA];
  if (isSubsequence(shorter, longer)) return 1;
  return jaccard;
};

function computeVariantClusters(variantsData) {
  const { variantDetails, tripToVariant } = variantsData;
  const si = state.gtfsData.stopsIndex;
  const vNums = Object.keys(variantDetails).map(Number);
  if (vNums.length < 2) return null;

  const seqs = Object.fromEntries(vNums.map(v => [v,
    variantDetails[v].stops.map(sid => getStationId(sid, si))]));

  const counts = Object.fromEntries(vNums.map(v => [v, 0]));
  Object.values(tripToVariant).forEach(v => { if (counts[v] !== undefined) counts[v]++; });

  const clusters = [];
  [...vNums].sort((a,b) => counts[b]-counts[a]).forEach(v => {
    let best = -1, bestS = -1;
    clusters.forEach((cl, ci) => {
      const avg = cl.reduce((s,cv) => s + jaccardSim(seqs[v], seqs[cv]), 0) / cl.length;
      if (avg > bestS) { bestS = avg; best = ci; }
    });
    bestS >= BUS_CLUSTER_JACCARD_THRESHOLD ? clusters[best].push(v) : clusters.push([v]);
  });

  const clusterTripCount = c => c.reduce((sum, v) => sum + (counts[v] || 0), 0);
  return clusters
    .map(c => ({ variantNums: c.sort((a,b) => a-b) }))
    .sort((a,b) => clusterTripCount(b.variantNums) - clusterTripCount(a.variantNums));
}

function allVariantsSingleTrip(variantsData) {
  const { variantDetails, tripToVariant } = variantsData;
  const vNums = Object.keys(variantDetails).map(Number);
  if (vNums.length < 2) return false;
  const counts = Object.fromEntries(vNums.map(v => [v, 0]));
  Object.values(tripToVariant).forEach(v => { if (counts[v] !== undefined) counts[v]++; });
  return vNums.every(v => counts[v] === 1);
}

function _getAnchorTime(stops, anchorStopIds) {
  const match = stops.find(s => anchorStopIds.includes(s.stop_id));
  return match ? (match.departure_time || match.arrival_time) : null;
}

function _findAnchorStopIds(trips, tripStopMaps, stopsIndex) {
  const counts = new Map();
  trips.forEach(t => {
    (tripStopMaps[t.trip_id] || []).forEach(s => {
      const sid = getStationId(s.stop_id, stopsIndex);
      counts.set(sid, (counts.get(sid) || 0) + 1);
    });
  });

  let max = 0, anchorId = null;
  counts.forEach((cnt, id) => { if (cnt > max) { max = cnt; anchorId = id; } });
  
  if (!anchorId) return null;
  return Object.values(stopsIndex)
    .filter(s => getStationId(s.stop_id, stopsIndex) === anchorId)
    .map(s => s.stop_id);
}

function sortTripsByMostFrequentStop(trips, tripStopMaps, stopsIndex) {
  if (!trips || trips.length === 0) return [];
  
  const tripCache = new Map();

  trips.forEach(trip => {
    const stops = tripStopMaps[trip.trip_id] || [];
    
    const timeMap = new Map();
    const stationOrder = [];

    stops.forEach(s => {
      const sId = getStationId(s.stop_id, stopsIndex);
      
      if (!timeMap.has(sId)) {
        const t = TimeUtils.toMinutes(TimeUtils.normalize(s.departure_time || s.arrival_time));
        timeMap.set(sId, t);
        stationOrder.push(sId);
      }
    });

    const startTime = stops.length > 0 
      ? TimeUtils.toMinutes(TimeUtils.normalize(stops[0].departure_time || stops[0].arrival_time))
      : 999999;

    tripCache.set(trip.trip_id, {
      id: trip.trip_id,
      timeMap,
      stationOrder,
      stationSet: new Set(stationOrder),
      startTime
    });
  });

  const sortedTrips = [...trips];

  sortedTrips.sort((tripA, tripB) => {
    const dataA = tripCache.get(tripA.trip_id);
    const dataB = tripCache.get(tripB.trip_id);

    let commonStationId = null;

    for (const sId of dataA.stationOrder) {
      if (dataB.stationSet.has(sId)) {
        commonStationId = sId;
        break;
      }
    }

    if (commonStationId) {
      const timeA = dataA.timeMap.get(commonStationId);
      const timeB = dataB.timeMap.get(commonStationId);
      return timeA - timeB;
    } else {
      return dataA.startTime - dataB.startTime;
    }
  });

  return sortedTrips;
}

// Receives trips already filtered to: active service AND passes through stopId.
// No need to re-check either condition here.
function findMostFrequentTripPattern(trips, stopTimesIndex) {
  const patternCounts = new Map();
  const patternToTrip = new Map();
  
  trips.forEach(trip => {
    const stopTimes = stopTimesIndex[trip.trip_id] || [];
    const sorted = [...stopTimes].sort((a, b) => 
      parseInt(a.stop_sequence || '0') - parseInt(b.stop_sequence || '0')
    );
    const pattern = sorted.map(st => st.stop_id).join(',');
    
    patternCounts.set(pattern, (patternCounts.get(pattern) || 0) + 1);
    if (!patternToTrip.has(pattern)) {
      patternToTrip.set(pattern, trip.trip_id);
    }
  });
  
  let maxCount = 0;
  let mostFrequentPattern = null;
  
  patternCounts.forEach((count, pattern) => {
    if (count > maxCount) {
      maxCount = count;
      mostFrequentPattern = pattern;
    }
  });
  
  if (!mostFrequentPattern) return null;
  
  const representativeTripId = patternToTrip.get(mostFrequentPattern);
  return {
    tripId: representativeTripId,
    stopIds: mostFrequentPattern.split(','),
    frequency: maxCount
  };
}

function getAvailableDirections() {
  if (!state.selectedRoute || !state.gtfsData) return [];

  let routeIds = [state.selectedRoute.route_id];
  if (state.selectedRouteGroup && Array.isArray(state.selectedRouteGroup.members)) {
    routeIds = state.selectedRouteGroup.members
      .map(r => r.route_id)
      .filter(Boolean);
  }

  let routeTripsAll = [];
  routeIds.forEach(rid => {
    const arr = state.gtfsData.tripsIndex[rid] || [];
    routeTripsAll = routeTripsAll.concat(arr);
  });

  const dirs = Object.create(null);
  for (const t of routeTripsAll) {
    const dirId = String(t.direction_id === undefined || t.direction_id === null ? '0' : t.direction_id);
    if (!dirs[dirId]) dirs[dirId] = { id: dirId, rows: 0, tripIds: new Set(), byFinalStop: Object.create(null), trips: [] };
    dirs[dirId].rows++;
    if (t.trip_id) dirs[dirId].tripIds.add(t.trip_id);
    
    const stopTimes = state.gtfsData.stopTimesIndex[t.trip_id] || [];
    const sorted = stopTimes.slice().sort((a, b) => a.stop_sequence - b.stop_sequence);
    const lastStopId = sorted[sorted.length - 1]?.stop_id;
    const lastStop = state.gtfsData.stopsIndex[lastStopId];
    const directionName = lastStop?.stop_name || '';
    
    if (directionName) dirs[dirId].byFinalStop[directionName] = (dirs[dirId].byFinalStop[directionName] || 0) + 1;
    dirs[dirId].trips.push(t);
  }

  const perDir = Object.keys(dirs).map(id => {
    const info = dirs[id];
    const finalStopEntries = Object.entries(info.byFinalStop).sort((a,b) => b[1] - a[1]);
    const top1Count = finalStopEntries.length ? finalStopEntries[0][1] : 0;
    const top1Label = finalStopEntries.length ? finalStopEntries[0][0] : '';
    const top2Count = finalStopEntries.length > 1 ? finalStopEntries[1][1] : 0;
    const top2Label = finalStopEntries.length > 1 ? finalStopEntries[1][0] : '';

    const commonFinalStop = finalStopEntries.length ? finalStopEntries[0][0] : '';
    let termini = '';
    let bestStops = null, bestLen = 0;
    for (const t of info.trips) {
      const sts = (state.gtfsData.stopTimesIndex && state.gtfsData.stopTimesIndex[t.trip_id]) || [];
      if (sts.length > bestLen) { bestLen = sts.length; bestStops = sts; }
    }
    if (bestStops && bestStops.length > 0) {
      const first = state.gtfsData.stopsIndex[bestStops[0].stop_id];
      const last  = state.gtfsData.stopsIndex[bestStops[bestStops.length - 1].stop_id];
      const firstName = first?.stop_name || bestStops[0].stop_id;
      const lastName  = last?.stop_name  || bestStops[bestStops.length - 1].stop_id;
      termini = (firstName && lastName && firstName !== lastName) ? `${firstName} – ${lastName}` : (lastName || firstName || '');
    }
    const fullName = commonFinalStop || termini || `Direction ${id}`;
    const score = (top1Count || 0) * 3 + (info.rows || 0);

    return {
      dir: id,
      rows: info.rows,
      distinctTripIds: info.tripIds.size,
      top1Count,
      top1Label,
      top2Count,
      top2Label,
      fullName,
      score,
      trips: info.trips
    };
  });

  perDir.sort((a,b) => (b.top1Count - a.top1Count) || (b.rows - a.rows));
  const heuristicResult = applyDirectionHeuristic(perDir, 1, 0.30);
  const labelsMap = heuristicResult.labels || {};

  const result = perDir.map((d, idx) => {
    const l = labelsMap[d.dir];
    const displayName = (l && l.display) ? l.display : (d.top1Label || d.fullName || d.dir);
    const safeDisplay = (displayName && String(displayName).trim()) ? displayName : (d.fullName || d.top1Label || d.dir);
    return { id: d.dir, name: safeDisplay, fullName: d.fullName, score: d.score };
  });

  return result;
}

function applyDirectionHeuristic(perDir, absDiff = 1, relRatio = 0.30) {
  const num = v => (typeof v === 'number' && !Number.isNaN(v)) ? v : 0;
  function closeEnough(x, y, absD, relR) {
    x = num(x); y = num(y);
    const diff = Math.abs(x - y);
    if (diff <= absD) return true;
    const denom = Math.max(Math.abs(x), Math.abs(y), 1);
    return (diff / denom) <= relR;
  }
  const list = Array.isArray(perDir) ? perDir.slice() : [];
  list.sort((a,b) => num(b.top1Count) - num(a.top1Count));
  const labels = {};
  const reason = { text: '', matched: null };
  if (list.length === 0) {
    reason.text = 'no directions';
    reason.matched = 'none';
    return { labels, reason };
  }
  if (list.length === 1) {
    const d = list[0];
    labels[d.dir] = { display: d.top1Label || '', mode: 'single' };
    reason.text = 'single direction';
    reason.matched = 'single';
    return { labels, reason };
  }
  const A = list[0];
  const B = list[1];
  const A_top1 = num(A.top1Count);
  const B_top1 = num(B.top1Count);
  const A_top2sum = A_top1 + num(A.top2Count);
  const B_top2sum = B_top1 + num(B.top2Count);
  if (closeEnough(A_top1, B_top1, absDiff, relRatio)) {
    labels[A.dir] = { display: A.top1Label || '', mode: 'top1-equal' };
    labels[B.dir] = { display: B.top1Label || '', mode: 'top1-equal' };
    reason.text = 'top1 equal';
    reason.matched = 'top1-equal';
    return { labels, reason };
  }
  function combinedLabel(d) {
    const left = d.top1Label || '';
    const right = d.top2Label || '';
    if (!left && !right) return '';
    if (!right) return left;
    if (!left) return right;
    return `${left} / ${right}`;
  }
  if (closeEnough(B_top2sum, A_top1, absDiff, relRatio)) {
    labels[A.dir] = { display: A.top1Label || '', mode: 'top1' };
    labels[B.dir] = { display: combinedLabel(B), mode: 'B_top2≈A_top1' };
    reason.text = 'B top2sum ≈ A top1';
    reason.matched = 'B_top2≈A_top1';
    return { labels, reason };
  }
  if (closeEnough(A_top2sum, B_top1, absDiff, relRatio)) {
    labels[A.dir] = { display: combinedLabel(A), mode: 'A_top2≈B_top1' };
    labels[B.dir] = { display: B.top1Label || '', mode: 'top1' };
    reason.text = 'A top2sum ≈ B top1';
    reason.matched = 'A_top2≈B_top1';
    return { labels, reason };
  }
  labels[A.dir] = { display: A.top1Label || '', mode: 'top1' };
  labels[B.dir] = { display: B.top1Label || '', mode: 'top1' };
  reason.text = 'default top1';
  reason.matched = 'default';
  return { labels, reason };
}

function getPolylineGeometry(stops, shapeId) {
  if (shapeId && state.gtfsData.shapesIndex && state.gtfsData.shapesIndex[shapeId]) {

        const lon = parseFloat(s.lon || s.stop_lon);
        return [lat, lon];
      })
      .filter(coords => !isNaN(coords[0]) && !isNaN(coords[1]));

  return [];

function filterStopDetailMapLayers(filteredRouteIds = []) {
  if (!state.stopDetailMapInstance || !state.stopDetailMapInitialized) {
    return;
  }

  const filterIds = (filteredRouteIds || []).map(String);
  const map = state.stopDetailMapInstance;

  Object.entries(state.stopDetailMapLayers).forEach(([layerKey, layer]) => {
    const routeId = layerKey.split('||')[0];
    const shouldShow = filterIds.length === 0 || filterIds.includes(routeId);

    if (shouldShow) {
      if (!map.hasLayer(layer)) {
        layer.addTo(map);
      }
    } else {
      if (map.hasLayer(layer)) {
        map.removeLayer(layer);
      }
    }
  });
}

const RouteHelpers = {
  reprOf: (group) => (group && group.members && group.members[0]) || null,
 
  labelOf: (group) => {
    const r = RouteHelpers.reprOf(group);
    if (!r) return group?.route_short_name || '';
    return r.route_short_name || r.route_id || group.route_short_name || '';
  },

  sortItems: (items, isGroup) => {
    return items.slice().sort((a, b) => {
      const la = String(isGroup ? RouteHelpers.labelOf(a) : (a.route_short_name || a.route_id || '')).trim();
      const lb = String(isGroup ? RouteHelpers.labelOf(b) : (b.route_short_name || b.route_id || '')).trim();
      return la.localeCompare(lb, undefined, { numeric: true, sensitivity: 'base' });
    });
  }
};

function getRouteTableViewModel(state) {
  if (!state.gtfsData) return { sections: [] };

  const { logicalRoutes, routes: baseRoutes, agenciesIndex } = state.gtfsData;
  const currentMode = state.routeGroupMode || 'service_type';

  const createItem = (item, isGroup) => {
    let label, routeType, id;

    if (isGroup) {
      const repr = RouteHelpers.reprOf(item);
      if (!repr) return null;
      label = RouteHelpers.labelOf(item);
      routeType = repr.route_type;
      id = item.id;
    } else {
      label = item.route_short_name || item.route_id || '';
      routeType = item.route_type;
      id = item.route_id;
    }

    const meta = getRouteTypeMeta(routeType);

    return {
      id: id,
      label: label,
      color: meta.color || '#e6eefb',
      isGroup: isGroup,
      dataset: {
        id: id,
        isGroup: isGroup ? 'true' : 'false'
      }
    };
  };

  const strategies = {

    'raw_routes': () => {
      return [{
        title: null,
        items: RouteHelpers.sortItems(baseRoutes, false)
          .map(r => createItem(r, false))
          .filter(Boolean)
      }];
    },

    'service_type': () => {
      if (!logicalRoutes.length) return [];
      const groupsByCat = new Map();
      
      logicalRoutes.forEach(group => {
        const repr = RouteHelpers.reprOf(group);
        const cat = repr ? (collectRouteType(repr).canonical || 'other') : 'other';
        if (!groupsByCat.has(cat)) groupsByCat.set(cat, []);
        groupsByCat.get(cat).push(group);
      });

      const catKeys = Array.from(groupsByCat.keys()).sort((a, b) => {
        const oa = CANONICAL_CATEGORIES[a]?.order ?? 999;
        const ob = CANONICAL_CATEGORIES[b]?.order ?? 999;
        if (oa !== ob) return oa - ob;
        return (CANONICAL_CATEGORIES[a]?.label || a).localeCompare(CANONICAL_CATEGORIES[b]?.label || b, undefined, { sensitivity: 'base' });
      });

      return catKeys.map(cat => ({
        title: CANONICAL_CATEGORIES[cat]?.label || cat || 'Other',
        items: RouteHelpers.sortItems(groupsByCat.get(cat), true)
          .map(g => createItem(g, true))
          .filter(Boolean)
      }));
    },

    'agency': () => {
      if (!logicalRoutes.length) return [];
      const byAgency = new Map();

      logicalRoutes.forEach(group => {
        const repr = RouteHelpers.reprOf(group);
        const agencyId = repr?.agency_id || group.agency_id || '';
        const agencyName = agencyId && agenciesIndex[agencyId]
          ? (agenciesIndex[agencyId].agency_name || agencyId)
          : 'Nieznany przewoźnik';
        
        if (!byAgency.has(agencyName)) byAgency.set(agencyName, []);
        byAgency.get(agencyName).push(group);
      });

      const agencyKeys = Array.from(byAgency.keys()).sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));

      return agencyKeys.map(name => ({
        title: name,
        items: RouteHelpers.sortItems(byAgency.get(name), true)
          .map(g => createItem(g, true))
          .filter(Boolean)
      }));
    }
  };

  const strategy = strategies[currentMode] || strategies['service_type'];
  return { sections: strategy() };
}

function renderRouteTable() {
  const container = $('routes-tbody');
  if (!container || !state.gtfsData) return;

  const viewModel = getRouteTableViewModel(state);

  container.innerHTML = RouteTableTemplates.layout(viewModel);

  if (container._routeClickHandler) {
    container.removeEventListener('click', container._routeClickHandler);
  }

  const clickHandler = (e) => {
    const btn = e.target.closest('.route-card');
    if (!btn) return;

    const id = btn.getAttribute('data-id');
    const isGroup = btn.getAttribute('data-is-group') === 'true';

    if (isGroup) {
      const group = state.gtfsData.logicalRoutes.find(g => g.id === id);
      if (group && group.members && group.members.length > 0) {
        state.selectedRouteGroup = group;
        selectRoute(group.members[0]);
      }
    } else {
      const route = findRouteById(id);
      if (route) {
        state.selectedRouteGroup = null;
        selectRoute(route);
      }
    }
  };

  container._routeClickHandler = clickHandler;
  container.addEventListener('click', clickHandler);
}

function selectRoute(route) {
  const container = document.querySelector('#routes-list-container');
  if (container) {
    state.routesListScrollPosition = container.scrollTop || 0;
  }
  
  state.selectedRoute = route;
  state.clusterModeEnabled = false;
  state.showAllTrips = false;
  state.selectedVariantFilter = 0;
  state.selectedVariant = 1;
  state._lastVariants = null

  if (!state.selectedRouteGroup ||
      !(state.selectedRouteGroup.members || []).some(r => r.route_id === route.route_id)) {
    state.selectedRouteGroup = null;
  }

  const routeTrips = state.gtfsData.tripsIndex[route.route_id] || [];
  if (routeTrips.length > 0) {
    state.selectedDirection = [...new Set(routeTrips.map(t => t.direction_id || '0'))][0];
  }

  invalidateCanonicalCacheForCurrentSelection();

  state.timetableScrollPosition = 0;

  resetMap();
  render();
}

function buildStopsSearchIndex(groupsArray) {
  if (stopsSearchIndex) return stopsSearchIndex;
  
  stopsSearchIndex = groupsArray.map(group => ({
    id: group.id,
    name: group.name,
    searchText: group.name.toLowerCase().trim(),
    routeCount: group.routeCount,
    stops: group.stops,
    routeSet: group.routeSet
  }));
  
  return stopsSearchIndex;
}

function clearStopsSearchIndex() {
  stopsSearchIndex = null;
}

function searchStopsInIndex(query, groupsArray) {
  if (!query || query.trim() === '') return groupsArray;
  
  const index = buildStopsSearchIndex(groupsArray);
  const lowerQuery = query.toLowerCase().trim();
  
  return index
    .filter(item => item.searchText.includes(lowerQuery))
    .map(item => ({
      id: item.id,
      name: item.name,
      routeCount: item.routeCount,
      stops: item.stops,
      routeSet: item.routeSet
    }));
}

async function searchStopsInIndexAsync(query, groupsArray, onProgress) {
  if (!query || query.trim() === '') return groupsArray;
  
  const index = buildStopsSearchIndex(groupsArray);
  const lowerQuery = query.toLowerCase().trim();
  const results = [];
  
  const CHUNK_SIZE = 200;
  
  for (let i = 0; i < index.length; i += CHUNK_SIZE) {
    const chunk = index.slice(i, i + CHUNK_SIZE);
    
    chunk.forEach(item => {
      if (item.searchText.includes(lowerQuery)) {
        results.push({
          id: item.id,
          name: item.name,
          routeCount: item.routeCount,
          stops: item.stops,
          routeSet: item.routeSet
        });
      }
    });
    
    if (onProgress && index.length > 1000) {
      const percent = Math.round(((i + chunk.length) / index.length) * 100);
      onProgress(percent);
    }
    
    if (i + CHUNK_SIZE < index.length) {
      await new Promise(resolve => setTimeout(resolve, 0));
    }
  }
  
  return results;
}

function getOrBuildGroupsArray(stopsData) {
  const currentHash = stopsData.length + '_' + (stopsData[0]?.stop_id || '');
  
  if (cachedGroupsArray && lastStopsDataHash === currentHash) {
    return cachedGroupsArray;
  }
  
  const stopGroups = new Map();
  stopsData.forEach(stop => {
    const stopName = stop.stop_name || '';
    const baseName = stopName.replace(/\s+\d+[A-Za-z]?$/, '').trim();
    
    if (!stopGroups.has(baseName)) {
      stopGroups.set(baseName, {
        id: baseName,
        name: baseName,
        stops: [],
        routeSet: new Set()
      });
    }
    
    const group = stopGroups.get(baseName);
    group.stops.push(stop);
    stop.routes.forEach(route => group.routeSet.add(route.route_id));
  });
  
  const groupsArray = Array.from(stopGroups.values()).map(group => ({
    ...group,
    routeCount: group.routeSet.size,
    isSingleStop: group.stops.length === 1
  }));
  
  groupsArray.sort((a, b) => a.name.localeCompare(b.name));
  
  cachedGroupsArray = groupsArray;
  lastStopsDataHash = currentHash;
  
  return groupsArray;
}

function measureStopItemHeight() {
  const firstItem = document.querySelector('.stop-group');
  if (firstItem) {
    const height = firstItem.offsetHeight;
    if (height > 0 && height !== state.virtualListItemHeight) {
      state.virtualListItemHeight = height;
    }
  }
}

function renderVirtualStopsList(groupsToRender) {
  const stopsList = $('stops-list');
  if (!stopsList) return;
  
  const container = stopsList.parentElement;
  if (!container) return;
  
  const containerHeight = container.clientHeight || 600;
  const scrollTop = container.scrollTop || 0;
  const itemHeight = state.virtualListItemHeight;
  
  const bufferSize = 5;
  const visibleCount = Math.ceil(containerHeight / itemHeight) + bufferSize * 2;
  const startIndex = Math.max(0, Math.floor(scrollTop / itemHeight) - bufferSize);
  const endIndex = Math.min(startIndex + visibleCount, groupsToRender.length);
  
  state.virtualListStartIndex = startIndex;
  
  const visibleGroups = groupsToRender.slice(startIndex, endIndex);
  const totalHeight = groupsToRender.length * itemHeight;
  const offsetY = startIndex * itemHeight;
  
  let html = `<div style="height: ${totalHeight}px;position:relative;">`;
  html += `<div style="position:absolute;top:${offsetY}px;left:0;right:0;">`;
  
  visibleGroups.forEach((group, idx) => {
    const actualIndex = startIndex + idx;
    const isGroupExpanded = state.expandedStopGroup === group.id;
    
    html += ViewTemplates.stopGroupRow(group, isGroupExpanded, actualIndex);
  });

  html += `</div></div>`;
  stopsList.innerHTML = html;
  
  if (state.virtualListItemHeight === 68) {
    setTimeout(measureStopItemHeight, 50);
  }
}

let cachedStopToRoutesMap = null;
let cachedStopToRoutesHash = null;

async function buildStopToRoutesMapAsync(routes, tripsIndex, stopTimesIndex, onProgress) {
  const stopToRoutes = new Map();
  const CHUNK_SIZE = 20;
  
  for (let i = 0; i < routes.length; i += CHUNK_SIZE) {
    const routeChunk = routes.slice(i, i + CHUNK_SIZE);
    
    routeChunk.forEach(route => {
      const trips = tripsIndex[route.route_id] || [];
      const stopIds = new Set();
      
      trips.forEach(trip => {
        const stopTimes = stopTimesIndex[trip.trip_id] || [];
        stopTimes.forEach(st => stopIds.add(st.stop_id));
      });
      
      stopIds.forEach(stopId => {
        if (!stopToRoutes.has(stopId)) stopToRoutes.set(stopId, []);
        stopToRoutes.get(stopId).push(route);
      });
    });
    
    if (onProgress) {
      const percent = Math.round(((i + routeChunk.length) / routes.length) * 100);
      onProgress(i + routeChunk.length, routes.length, percent);
    }
    
    if (i + CHUNK_SIZE < routes.length) {
      await new Promise(resolve => setTimeout(resolve, 0));
    }
  }
  
  return stopToRoutes;
}

async function getStopToRoutesMap(routes, tripsIndex, stopTimesIndex, onProgress) {
  const currentHash = routes.length + '_' + Object.keys(tripsIndex).length;
  
  if (cachedStopToRoutesMap && cachedStopToRoutesHash === currentHash) {
    return cachedStopToRoutesMap;
  }
  
  const stopToRoutes = await buildStopToRoutesMapAsync(routes, tripsIndex, stopTimesIndex, onProgress);
  
  cachedStopToRoutesMap = stopToRoutes;
  cachedStopToRoutesHash = currentHash;
  
  return stopToRoutes;
}

function clearStopToRoutesCache() {
  cachedStopToRoutesMap = null;
  cachedStopToRoutesHash = null;
}

const StopMapController = {
  instance: null,
  markerCluster: null,


  reset() {
    if (this.instance) {
      this.instance.remove();
      this.instance = null;
    }
    this.markerCluster = null;
    window.stopsListMap = null;
  },

initOrUpdate(containerId, stopsData, expandedGroupId, groupsArray) {
  const initialCenter = state.stopsListMapState 
    ? [state.stopsListMapState.center.lat, state.stopsListMapState.center.lng] 
    : [52.23, 21.01];
  const initialZoom = state.stopsListMapState ? state.stopsListMapState.zoom : 12;

  const previousInstance = MapService.instances.get(containerId);
  this.instance = MapService.init(containerId, initialCenter, initialZoom);
  
  if (!this.instance) return;
  
  window.stopsListMap = this.instance;

  if (!this.instance.hasEventListeners('moveend')) {
    this.instance.on('moveend', () => {
      const center = this.instance.getCenter();
      state.stopsListMapState = {
        center: { lat: center.lat, lng: center.lng },
        zoom: this.instance.getZoom(),
        expandedGroup: state.expandedStopGroup
      };
    });
  }

  // If the map instance was reused (same object), markers are still attached — skip rebuild.
  const mapWasReused = previousInstance && this.instance === previousInstance;
  if (mapWasReused && this.markerCluster) return;

  // Map was recreated (DOM replaced by render()) - old markerCluster is orphaned.
  if (!mapWasReused) this.markerCluster = null;

  this.renderMarkers(stopsData, expandedGroupId);
},

renderMarkers(stopsData, expandedGroupId) {
    if (!this.instance) return;

    const map = this.instance;

    if (this.markerCluster) {
      map.removeLayer(this.markerCluster);
    }

    this.markerCluster = window.L.markerClusterGroup({
      maxClusterRadius: 30,
      spiderfyOnMaxZoom: true,
      showCoverageOnHover: false,
      disableClusteringAtZoom: 17,
      iconCreateFunction: function(cluster) {
        const count = cluster.getChildCount();
        let c = ' marker-cluster-';
        if (count < 10) c += 'small'; else if (count < 100) c += 'medium'; else c += 'large';
        return new window.L.DivIcon({
          html: '<div><span>' + count + '</span></div>',
          className: 'marker-cluster marker-cluster-neutral' + c,
          iconSize: new window.L.Point(40, 40)
        });
      }
    });

    const bounds = [];
    const expandedBounds = [];

    stopsData.forEach(stop => {
      const lat = parseFloat(stop.stop_lat);
      const lon = parseFloat(stop.stop_lon);
      if (isNaN(lat) || isNaN(lon)) return;

const popupHtml = expandedGroupId === null ? `
          <a href="#" onclick="event.preventDefault(); 
            state.selectedStop = state.gtfsData.stopsIndex['${stop.stop_id}']; 
            state.stopViewFilteredRoutes = []; 
            state.stopsListMapState = null;
            render(); 
            return false;" 
            style="text-decoration: none; color:inherit;">
            <strong>${escapeHtml(stop.stop_name)}</strong><br>
            ${formatRouteCount(stop.routeCount)}
          </a>
        ` : null;

      const clickHandler = expandedGroupId !== null ? () => {
          state.selectedStop = stop;
          state.stopViewFilteredRoutes = [];
          render();
      } : null;

      MapUtils.addMarker(this.markerCluster, lat, lon, {
        color: '#f97316',
        popupContent: popupHtml,
        onClick: clickHandler
      });
      bounds.push([lat, lon]);

      if (expandedGroupId) {
          const normName = stop.stop_name.replace(/\s+\d+[A-Za-z]?$/, '').trim();
          if (normName === expandedGroupId) expandedBounds.push([lat, lon]);
      }
    });

    map.addLayer(this.markerCluster);

    if (expandedBounds.length > 0 && !state.stopsListMapState) {
       map.flyToBounds(expandedBounds, { padding: [50, 50], maxZoom: 17, duration: 0.5 });
    } else if (bounds.length > 0 && !state.stopsListMapState) {
       map.fitBounds(bounds, { padding: [50, 50], maxZoom: 15 });
    }
  }
};

const RouteMapController = {
  layerGroup: null,
  
  draw(containerId, variantsData, selectedVariantId, routeColor) {
    const map = MapService.init(containerId, [51.94, 13.88], 11);
    if (!map) return;

    if (!this.layerGroup) {
      this.layerGroup = window.L.featureGroup().addTo(map);
    } else if (!map.hasLayer(this.layerGroup)) {
      this.layerGroup.addTo(map);
    }
    this.layerGroup.clearLayers();

    if (!variantsData || !variantsData.variantDetails) return;

    let variantId = selectedVariantId;
    if (!variantsData.variantDetails[variantId]) {
      const keys = Object.keys(variantsData.variantDetails);
      variantId = keys.length ? parseInt(keys[0]) : variantId;
    }
    
    const variant = variantsData.variantDetails[variantId];
    if (!variant || !variant.stopDetails.length) return;

    const variantTrips = variantsData.trips.filter(t => variantsData.tripToVariant[t.trip_id] === variantId);
    const shapeId = variantTrips.length > 0 ? variantTrips[0].shape_id : null;

    const lineGeometry = getPolylineGeometry(variant.stopDetails, shapeId);

    if (lineGeometry.length > 1) {
      this.layerGroup.addLayer(window.L.polyline(lineGeometry, { 
        color: routeColor || '#3b82f6', 
        weight: 5, 
        opacity: 0.9, 
        smoothFactor: 0.5 
      }));
    }

    variant.stopDetails.forEach(s => {
      MapUtils.addMarker(this.layerGroup, parseFloat(s.stop_lat), parseFloat(s.stop_lon), {
        color: routeColor || '#3b82f6',
        popupContent: `<b>${escapeHtml(s.stop_name)}</b><br><span style="font-size:0.8em">ID: ${s.stop_id}</span>`,
      });
    });

    const bounds = this.layerGroup.getBounds();
    if (bounds.isValid()) {
      map.fitBounds(bounds, { padding: [20, 20], maxZoom: 16, animate: false });
    }
  }
};

function _bindStopsListEvents(stopsListEl, useVirtualList, filteredGroups) {
  if (useVirtualList) {
    const container = stopsListEl.parentElement;
    if (container) {
      if (container._virtualScrollHandler) container.removeEventListener('scroll', container._virtualScrollHandler);
      const scrollHandler = debounce(() => renderVirtualStopsList(filteredGroups), 50);
      container._virtualScrollHandler = scrollHandler;
      container.addEventListener('scroll', scrollHandler);
    }
  }

  const searchInput = $('stops-search-input-header');
  if (searchInput) {
    if (searchInput.value !== state.stopsListSearchQuery) searchInput.value = state.stopsListSearchQuery;
    if (!searchInput._searchHandlerAttached) {
       const debouncedSearch = debounce((value) => {
        state.stopsListSearchQuery = value;
        state.stopsListPage = 1;
        renderStopsView();
      }, 500);
      searchInput.addEventListener('input', (e) => debouncedSearch(e.target.value));
      searchInput._searchHandlerAttached = true;
    }
  }
}

function _bindStopsListClickDelegation(stopsListEl, stopsData, groupsArray) {
  const container = stopsListEl.parentElement || stopsListEl;
  
  if (container._delegatedClickHandler) {
    container.removeEventListener('click', container._delegatedClickHandler);
  }

  const handler = (e) => {
    const groupHeader = e.target.closest('.stop-group');
    
    if (groupHeader && !e.target.closest('.stop-item')) {
      const groupId = groupHeader.getAttribute('data-group-id');
      const singleStopId = groupHeader.getAttribute('data-stop-id');

      if (groupId) {
        e.preventDefault();
        e.stopPropagation();
        _handleGroupExpansion(groupId, groupsArray);
        return;
      } 
      
      if (singleStopId) {
        e.preventDefault();
        _selectStopAndRender(singleStopId);
        return;
      }
    }

    const stopItem = e.target.closest('.stop-item');
    if (stopItem) {
      e.preventDefault();
      const stopId = stopItem.getAttribute('data-stop-id');
      if (stopId) {
        _selectStopAndRender(stopId);
      }
    }
  };

  container._delegatedClickHandler = handler;
  container.addEventListener('click', handler);
}

function _selectStopAndRender(stopId) {
  const stop = state.gtfsData.stopsIndex[stopId];
  if (stop) {
    if (StopMapController.instance && stop.stop_lat && stop.stop_lon) {
      StopMapController.instance.setView([parseFloat(stop.stop_lat), parseFloat(stop.stop_lon)], 17);
    }
    state.selectedStop = stop;
    state.stopViewFilteredRoutes = [];
    render();
  }
}

function _handleGroupExpansion(groupId, groupsArray) {
  const group = groupsArray.find(g => g.id === groupId);
  if (group && group.stops.length > 0 && StopMapController.instance) {
    const bounds = window.L.latLngBounds();
    group.stops.forEach(s => { if(s.stop_lat && s.stop_lon) bounds.extend([s.stop_lat, s.stop_lon]); });
    if (bounds.isValid()) {
      StopMapController.instance.flyToBounds(bounds, { padding: [50, 50], maxZoom: 17, duration: 0.5 });
    }
  }
  state.expandedStopGroup = (state.expandedStopGroup === groupId) ? null : groupId;
  if (state.filteredStopGroups) {
    renderVirtualStopsList(state.filteredStopGroups);
  } else {
    renderStopsView();
  }
}

async function renderStopsView() {
  if (!state.gtfsData || !state.showStopsView) return;

  const stopsListEl = $('stops-list');
  const stopsMapEl = $('stops-map');
  if (!stopsListEl || !stopsMapEl) return;

  const isInitialLoad = !cachedStopToRoutesMap;
  if (isInitialLoad) stopsListEl.innerHTML = ViewTemplates.statusMessage("Przygotowywanie danych przystanków...");

  const stopToRoutes = await getStopToRoutesMap(
    state.gtfsData.routes,
    state.gtfsData.tripsIndex,
    state.gtfsData.stopTimesIndex,
    isInitialLoad ? (p, t, pct) => stopsListEl.innerHTML = ViewTemplates.statusMessage(`Przygotowywanie... ${pct}%`) : null
  );

  const stopsData = Object.values(state.gtfsData.stopsIndex)
    .filter(stop => stopToRoutes.has(stop.stop_id))
    .map(stop => ({
      ...stop,
      routes: stopToRoutes.get(stop.stop_id),
      routeCount: stopToRoutes.get(stop.stop_id).length
    }))
    .sort((a, b) => (a.stop_name || '').localeCompare(b.stop_name || ''));

  const groupsArray = getOrBuildGroupsArray(stopsData);

  const searchQuery = state.stopsListSearchQuery;
  let filteredGroups;
  if (groupsArray.length > 1000 && searchQuery && searchQuery.trim() !== '') {
    stopsListEl.innerHTML = ViewTemplates.statusMessage("Wyszukiwanie...");
    filteredGroups = await searchStopsInIndexAsync(searchQuery, groupsArray, (pct) => {
      stopsListEl.innerHTML = ViewTemplates.statusMessage(`Wyszukiwanie... ${pct}%`);
    });
  } else {
    filteredGroups = searchStopsInIndex(searchQuery, groupsArray);
  }

  renderVirtualStopsList(filteredGroups);
  state.filteredStopGroups = filteredGroups;

  _bindStopsListEvents(stopsListEl, true, filteredGroups);
  _bindStopsListClickDelegation(stopsListEl, stopsData, groupsArray);
  
  StopMapController.initOrUpdate('stops-map', stopsData, state.expandedStopGroup, groupsArray);
}

// Single pass through T×S producing everything both prepareStopDetail and
// collectRoutesForStop need. Returns:
//   departures   – sorted array for the timetable table
//   routesAtStop – Map<route_id, route>
//   tripsForRoute – Map<route_id, trip[]>  (only active-service trips that pass through stopId)
function computeStopDataForDate(stopId, selectedDate) {
  const activeServices = new Set(getServicesForDate(selectedDate));
  const departures = [];
  const routesAtStop = new Map();
  const tripsForRoute = new Map();

  state.gtfsData.routes.forEach(route => {
    const trips = state.gtfsData.tripsIndex[route.route_id] || [];
    trips.forEach(trip => {
      if (!activeServices.has(trip.service_id)) return;
      const stopTimes = state.gtfsData.stopTimesIndex[trip.trip_id] || [];
      const stopTime = stopTimes.find(st => st.stop_id === stopId);
      if (!stopTime) return;

      // --- data for timetable table ---
      const sortedStopTimes = [...stopTimes].sort((a, b) =>
        parseInt(a.stop_sequence || '0') - parseInt(b.stop_sequence || '0'));
      const lastStopId = sortedStopTimes[sortedStopTimes.length - 1]?.stop_id;
      const currentStationId = getStationId(stopTime.stop_id, state.gtfsData.stopsIndex);
      const lastStationId = getStationId(lastStopId, state.gtfsData.stopsIndex);
      if (currentStationId === lastStationId) return;  // terminus – skip

      const departureTime = stopTime.departure_time || stopTime.arrival_time;
      if (departureTime) {
        departures.push({
          route, trip, time: departureTime,
          timeMinutes: TimeUtils.toMinutes(departureTime),
          headsign: trip.trip_headsign || ''
        });
        if (!routesAtStop.has(route.route_id)) routesAtStop.set(route.route_id, route);
      }

      // --- pre-filtered trips for findMostFrequentTripPattern ---
      if (!tripsForRoute.has(route.route_id)) tripsForRoute.set(route.route_id, []);
      tripsForRoute.get(route.route_id).push(trip);
    });
  });

  departures.sort((a, b) => a.timeMinutes - b.timeMinutes);
  return { departures, routesAtStop, tripsForRoute };
}

function collectRoutesForStop(stopId, selectedDate, filteredRouteIds = []) {
  if (!state.gtfsData || !stopId) return { routes: [] };

  const { routesAtStop, tripsForRoute } = computeStopDataForDate(stopId, selectedDate);
  const routesData = [];

  let routesToProcess = Array.from(routesAtStop.values());
  if (filteredRouteIds.length > 0) {
    routesToProcess = routesToProcess.filter(r => filteredRouteIds.includes(r.route_id));
  }

  routesToProcess.forEach(route => {
    const preFilteredTrips = tripsForRoute.get(route.route_id) || [];

    const representative = findMostFrequentTripPattern(
      preFilteredTrips,
      state.gtfsData.stopTimesIndex
    );
    if (!representative) return;

    const stopsToDraw = [];
    representative.stopIds.forEach(sid => {
      const stop = state.gtfsData.stopsIndex[sid];
      if (stop && stop.stop_lat && stop.stop_lon) {
        const lat = parseFloat(stop.stop_lat);
        const lon = parseFloat(stop.stop_lon);
        if (!isNaN(lat) && !isNaN(lon)) {
          stopsToDraw.push({ id: sid, lat, lon, name: stop.stop_name || sid, type: 'core' });
        }
      }
    });

    if (stopsToDraw.length > 0) {
      const meta = getRouteTypeMeta(route.route_type);
      const representativeTrip = preFilteredTrips.find(t => t.trip_id === representative.tripId);
      const shapeId = representativeTrip?.shape_id || null;
      const direction = representativeTrip?.direction_id || '0';

      routesData.push({
        route,
        direction,
        directionName: `Direction ${direction}`,
        stops: stopsToDraw,
        color: meta.color || '#3b82f6',
        tripCount: representative.frequency,
        shapeId
      });
    }
  });

  return { routes: routesData };
}

function getTripDestination(dep) {
  if (dep.headsign && dep.headsign.trim().length > 0) {
    return dep.headsign;
  }
  
  const stopTimes = state.gtfsData.stopTimesIndex[dep.trip.trip_id] || [];
  if (stopTimes.length > 0) {
    const sorted = stopTimes.slice().sort((a, b) => {
      const seqA = parseInt(a.stop_sequence || '0', 10);
      const seqB = parseInt(b.stop_sequence || '0', 10);
      return seqA - seqB;
    });
    const lastStopId = sorted[sorted.length - 1]?.stop_id;
    const lastStop = state.gtfsData.stopsIndex[lastStopId];
    if (lastStop?.stop_name) {
      return lastStop.stop_name;
    }
  }
  
  return "-";
}

//════════════════════════════════
// ROUTE TIMETABLE DATA PROCESSOR 
//════════════════════════════════

const TimetableDataProcessor = {
  enrichTripsWithProfile: (trips, profile) => {
    if (!profile) return trips.map(t => ({ ...t }));
    
    return trips.map(trip => {
      const tripData = profile.processedTrips?.[trip.trip_id];
      if (!tripData) return null;
      return {
        ...trip,
        pStops: tripData.pStops,
      };
    }).filter(Boolean);
  },

filterTrips: (trips, variantFilter, tripToVariant) => {
    return trips.filter(t => {
      if (variantFilter > 0) {
        return tripToVariant?.[t.trip_id] === variantFilter;
      }
      return true;
    });
  },

  buildTripStopMaps: (trips, gtfsData, showAll) => {
    const tripStopMaps = {}; 
    const rawTripStopMaps = {};
    
    trips.forEach(t => {
      const rawStops = gtfsData.stopTimesIndex[t.trip_id] || [];
      rawTripStopMaps[t.trip_id] = rawStops;
      tripStopMaps[t.trip_id] = showAll ? rawStops : (t.pStops || rawStops);
    });
    
    return { tripStopMaps, rawTripStopMaps };
  },

  computeVisibleRows: (masterList, mappings) => {
    const visibleIndices = [];
    masterList.forEach((row, idx) => {
      const hasStop = mappings.some(m => m[idx]);
      if (hasStop) visibleIndices.push(idx);
    });
    return visibleIndices;
  }
};

function prepareTimetableData() {
  if (!state.selectedRoute || !state.gtfsData) return null;

  const rawTrips = getAllTripsForRoute();
  if (rawTrips.length === 0) return null;

  const variantsData = computeVariantsForRoute();
  const profile = getCurrentRouteProfile();
  const tripToVariant = variantsData?.tripToVariant || {};

  const enrichedTrips = TimetableDataProcessor.enrichTripsWithProfile(rawTrips, profile);
  
  const filteredTrips = TimetableDataProcessor.filterTrips(
    enrichedTrips, 
    state.selectedVariantFilter,
    tripToVariant
  );

  if (filteredTrips.length === 0) return null;

  const { tripStopMaps, rawTripStopMaps } = TimetableDataProcessor.buildTripStopMaps(
    filteredTrips, 
    state.gtfsData, 
    state.showAllTrips
  );

  const sortedTrips = sortTripsByMostFrequentStop(filteredTrips, rawTripStopMaps, state.gtfsData.stopsIndex);

  const masterList = ensureCanonicalMasterListForCurrentSelection() || 
                     buildCanonicalMasterList(profile, sortedTrips, tripStopMaps, state.gtfsData.stopsIndex);

  if (!masterList || masterList.length === 0) return null;

  const mappings = createTripMappings(sortedTrips, tripStopMaps, masterList);
  const visibleRowIndices = TimetableDataProcessor.computeVisibleRows(masterList, mappings);

  const clusters = state.selectedVariantFilter === 0 ? computeVariantClusters(variantsData) : null;
  const hasDepotTrips = !!(profile?.tailTripIds?.size > 0);

  return {
    showAllState: state.showAllTrips,
    variantsData,
    trips: sortedTrips,
    masterList,
    visibleRowIndices,
    mappings,
    tripToVariant,
    totalTripCount: rawTrips.length,
    clusters,
    hasDepotTrips
  };
}

function getTimetableViewModel(data, clusters) {
  const { variantsData, trips, masterList, visibleRowIndices, mappings, tripToVariant, totalTripCount, hasDepotTrips } = data;
  
  const isSingleMode = state.selectedVariantFilter > 0;
  
  let isRail = false;
  if (state.selectedRoute) {
     const rt = parseInt(state.selectedRoute.route_type, 10);
     isRail = (rt === 2 || (rt >= 100 && rt <= 117) || rt === 300 || rt === 400);
  }

  const skipDepotDetection = (totalTripCount ?? 0) <= 21;

  const variantCount = Object.keys(variantsData?.variantDetails || {}).length;
  const isBus = isBusRoute(state.selectedRoute);
  const obligatoryCluster = isBus &&
    (variantCount >= BUS_CLUSTER_MIN_VARIANTS || allVariantsSingleTrip(variantsData));
  const canCluster = clusters && clusters.length > 1;

  let variantLabel = '';

  const targetId = state.selectedVariantFilter > 0 ? state.selectedVariantFilter : state.selectedVariant;

  if (variantsData && variantsData.variantDetails && variantsData.variantDetails[targetId]) {
      const v = variantsData.variantDetails[targetId];
      const start = v.stopDetails[0]?.stop_name || '?';
      const end = v.stopDetails[v.stopDetails.length - 1]?.stop_name || '?';
      variantLabel = `${start} - ${end}`;
  }

  const controls = {
    singleValue: state.selectedVariantFilter,
    singleOptions: [],
    variantLabel: variantLabel,
    showClusterToggle: canCluster && !obligatoryCluster,
    clusterModeEnabled: obligatoryCluster || state.clusterModeEnabled,
    clusterIsObligatory: obligatoryCluster,
    toggleButton: {
      text: state.showAllTrips ? 'Ukryj zjazdy' : 'Pokaż zjazdy',
      className: '',
      show: !isRail && (hasDepotTrips || state.showAllTrips),
      isDisabled: isSingleMode
    }
  };

  if (variantsData && variantsData.variantDetails) {
    const vNums = Object.keys(variantsData.variantDetails).map(Number).sort((a, b) => a - b);
    controls.singleOptions.push({ value: 0, label: 'Wszystkie', selected: state.selectedVariantFilter === 0 });
    vNums.forEach(v => {
      controls.singleOptions.push({
        value: v,
        label: `Wariant #${v}`,
        selected: state.selectedVariantFilter === v
      });
    });
  }

  const headers = trips.map(trip => {
    const vNum = tripToVariant[trip.trip_id] || 1;
    const isSelected = (state.selectedVariant === vNum);
    return {
      label: `#${vNum}`,
      variantId: vNum,
      className: isSelected ? 'bg-orange-500 text-white' : 'text-gray-600 hover:text-orange-500'
    };
  });

  const rows = visibleRowIndices.map(idx => {
    const rowData = masterList[idx];
    const isMergedStop = rowData.stopIds && rowData.stopIds.length > 1;

    const cells = mappings.map(map => {
      const cellData = map[idx];
      if (!cellData) {
        return { type: 'empty', content: '<' };
      }
      const time = TimeUtils.formatForDisplay(cellData.departure_time || cellData.arrival_time);
      let tooltip = null;
      if (isMergedStop) {
        const stopInfo = state.gtfsData.stopsIndex[cellData.stop_id];
        if (stopInfo) {
          const parts = [];
          if (stopInfo.platform_code) parts.push(`Peron: ${escapeHtml(stopInfo.platform_code)}`);
          else if (stopInfo.stop_name && stopInfo.stop_name !== rowData.name) parts.push(escapeHtml(stopInfo.stop_name));
          if (parts.length > 0) tooltip = parts.join('<br>');
        }
      }
      return { type: 'time', content: time, tooltip: tooltip };
    });

    return { 
      stopId: rowData.id, 
      stopIds: rowData.stopIds,
      stopName: rowData.name, 
      cells 
    };
  });

  // Ukryj kolumny składające się wyłącznie z pustych komórek (tripy-zjazdy bez żadnego przystanku pasażerskiego)
  // oraz kolumny z tylko jednym odjazdem (np. zjazdy techniczne z jednym przystankiem)
  const hasEnoughTimes = headers.map((_, colIdx) => {
    let count = 0;
    for (const row of rows) {
      if (row.cells[colIdx]?.type !== 'empty') {
        count++;
        if (count >= 2) return true;
      }
    }
    return false;
  });
  const filteredHeaders = headers.filter((_, i) => hasEnoughTimes[i]);
  const filteredRows = rows.map(row => ({
    ...row,
    cells: row.cells.filter((_, i) => hasEnoughTimes[i])
  }));

  return { controls, headers: filteredHeaders, rows: filteredRows };
}

function renderNoCoursesFallback(container) {
  if (!state.selectedRoute || !state.gtfsData || !state.availableDates) return;

  const routeId = state.selectedRoute.route_id;
  const directionId = state.selectedDirection;
  
  const routeServiceIds = new Set();
  const trips = (state.gtfsData.tripsIndex[routeId] || []);
  for (let i = 0; i < trips.length; i++) {
    const t = trips[i];
    if (String(t.direction_id || '0') === String(directionId)) {
      routeServiceIds.add(t.service_id);
    }
  }

  if (routeServiceIds.size === 0) {
    container.innerHTML = `<div class='p-4 text-gray-500'>Brak kursów w tym kierunku.</div>`;
    return;
  }

  const currentIndex = state.availableDates.findIndex(d => d.value === state.selectedDate);
  let nextValidDate = null;
  let prevValidDate = null;

  if (currentIndex > -1) {
    for (let i = currentIndex - 1; i >= 0; i--) {
      const d = state.availableDates[i];
      if (getServicesForDate(d.value).some(srv => routeServiceIds.has(srv))) {
        prevValidDate = d;
        break; 
      }
    }

    for (let i = currentIndex + 1; i < state.availableDates.length; i++) {
      const d = state.availableDates[i];
      if (getServicesForDate(d.value).some(srv => routeServiceIds.has(srv))) {
        nextValidDate = d;
        break; 
      }
    }
  }

  if (nextValidDate || prevValidDate) {
    let html = `<div class="flex flex-col items-start justify-start p-10 text-left">`;

    if (prevValidDate) {
      html += `
        <div class="p-4 text-gray-500">
          Ostatnie odjazdy:
          <a href="#" 
             class="p-4 text-gray-500 font-bold hover:text-gray-800"
             onclick="event.preventDefault(); state.selectedDate='${prevValidDate.value}'; document.getElementById('date-select').value='${prevValidDate.value}'; render();"
          >
            ${prevValidDate.label}
          </a>
        </div>
      `;
    }

    if (nextValidDate) {
      html += `
        <div class="p-4 text-gray-500">
          Najbliższe odjazdy:
          <a href="#" 
             class="p-4 text-gray-500 font-bold hover:text-gray-800"
             onclick="event.preventDefault(); state.selectedDate='${nextValidDate.value}'; document.getElementById('date-select').value='${nextValidDate.value}'; render();"
          >
            ${nextValidDate.label}
          </a>
        </div>
      `;
    }

    html += `</div>`;
    container.innerHTML = html;

  } else {
    container.innerHTML = `<div class='p-4 text-gray-500'>Brak kursów w całym dostępnym kalendarzu.</div>`;
  }
}

function renderTimetable() {
  const container = $('timetable-container');
  if (!container) return;
  const scrollWrapper = container.querySelector('.tt-table-wrapper');

  let savedScrollLeft = 0;
  if (scrollWrapper) savedScrollLeft = scrollWrapper.scrollLeft;

  const data = prepareTimetableData();

  if (!data) {
    renderNoCoursesFallback(container);
    return;
  }

  const { clusters } = data;
  const variantCount = Object.keys(data.variantsData?.variantDetails || {}).length;
  const isBus = isBusRoute(state.selectedRoute);
  const obligatoryCluster = isBus &&
    (variantCount >= BUS_CLUSTER_MIN_VARIANTS || allVariantsSingleTrip(data.variantsData));
  const clusterModeActive = clusters && clusters.length > 1 &&
    (obligatoryCluster || state.clusterModeEnabled);

  if (clusterModeActive) {
    state.clusterModeEnabled = true;
    renderClusteredTimetable(container, data, clusters, savedScrollLeft);
    return;
  }

  const viewModel = getTimetableViewModel(data, clusters);

  container.innerHTML = `
    ${TimetableTemplates.controls(viewModel)}
    <div id="schedule-table-root">
      ${TimetableTemplates.table(viewModel)}
    </div>
  `;

  const newScrollWrapper = container.querySelector('.tt-table-wrapper');
  if (newScrollWrapper && savedScrollLeft > 0) newScrollWrapper.scrollLeft = savedScrollLeft;

  bindTimetableControls(container, viewModel.controls.isVarMode);
  bindTableEvents(container);
  bindTooltipBehavior(container);
}

function bindTimetableControls(container) {
  const btn = container.querySelector('#toggle-depot-trips-main');
  if (btn) {
    btn.onclick = () => {
      if (btn.hasAttribute('disabled')) return;
      state.showAllTrips = !state.showAllTrips;
      renderTimetable();
    };
  }

  const singleSelect = container.querySelector('#variant-filter-select');
  if (singleSelect) {
    singleSelect.onchange = (e) => {
      state.selectedVariantFilter = parseInt(e.target.value, 10);
      
      if (state.selectedVariantFilter > 0) {
        state.selectedVariant = state.selectedVariantFilter;
      }
      
      renderTimetable();
      if (typeof updateMap === 'function') updateMap();
    };
  }

  const clusterBtn = container.querySelector('#toggle-cluster-mode');
  if (clusterBtn) {
    clusterBtn.onclick = () => {
      state.clusterModeEnabled = !state.clusterModeEnabled;
      renderTimetable();
    };
  }
}

function bindTableEvents(container) {
  const variantHeaders = container.querySelectorAll('th[data-variant]');
  variantHeaders.forEach(th => {
    th.addEventListener('click', () => {
      const v = parseInt(th.getAttribute('data-variant'), 10);
      if (v && !isNaN(v)) {
        state.selectedVariant = v;
        renderTimetable();
        if (typeof updateMap === 'function') updateMap();
      }
    });
  });

  const tbody = container.querySelector('tbody');
  if (tbody) {
    tbody.addEventListener('click', (e) => {
      const target = e.target.closest('.js-stop-click');
      if (target) {
        const stopId = target.getAttribute('data-stop-id');
        if (stopId && typeof openStopTimetable === 'function') {
           openStopTimetable(stopId);
        }
      }
    });
  }
}

function bindTooltipBehavior(container) {
  setTimeout(() => {
    const timeCells = container.querySelectorAll('.time-cell-with-tooltip');
    timeCells.forEach(cell => {
      cell.addEventListener('mouseenter', function() {
        const tooltip = this.querySelector('.tooltip-content');
        if (!tooltip) return;

        tooltip.style.top = '';
        tooltip.style.left = '';

        const cellRect = this.getBoundingClientRect();
        const tooltipRect = tooltip.getBoundingClientRect();

        const top = Math.max(10, cellRect.top - tooltipRect.height - 8);
        const left = Math.max(10, Math.min(
          cellRect.left + (cellRect.width / 2) - (tooltipRect.width / 2),
          window.innerWidth - tooltipRect.width - 10
        ));

        tooltip.style.position = 'fixed';
        tooltip.style.top = top + 'px';
        tooltip.style.left = left + 'px';
      });
    });
  }, 0);
}

function prepareTimetableDataForCluster(variantNums, allVariantsData) {
  if (!state.selectedRoute || !state.gtfsData) return null;
  const vSet = new Set(variantNums);
  const { tripToVariant } = allVariantsData;
  const allTrips = getAllTripsForRoute();
  const clusterTrips = allTrips.filter(t => vSet.has(tripToVariant[t.trip_id]));
  if (!clusterTrips.length) return null;

  const profile = getCurrentRouteProfile();
  const skipDepotDetection = allTrips.length <= 21;
  const effectiveShowAll = state.showAllTrips || skipDepotDetection;

  const enriched = TimetableDataProcessor.enrichTripsWithProfile(clusterTrips, profile);
  const filtered = TimetableDataProcessor.filterTrips(enriched, 0, tripToVariant);
  if (!filtered.length) return null;

  const { tripStopMaps, rawTripStopMaps } = TimetableDataProcessor.buildTripStopMaps(filtered, state.gtfsData, effectiveShowAll);
  const sorted = sortTripsByMostFrequentStop(filtered, rawTripStopMaps, state.gtfsData.stopsIndex);
  const masterList = buildClusterMasterList(variantNums, allVariantsData, tripStopMaps);
  if (!masterList?.length) return null;

  const mappings = createTripMappings(sorted, tripStopMaps, masterList);
  const hasDepotTrips = !!(profile?.tailTripIds?.size > 0);
  return {
    showAllState: effectiveShowAll, variantsData: allVariantsData,
    trips: sorted, masterList, mappings, tripToVariant,
    visibleRowIndices: TimetableDataProcessor.computeVisibleRows(masterList, mappings),
    totalTripCount: allTrips.length,
    hasDepotTrips
  };
}

  const badge = v => `<span style="display:inline-flex;align-items:center;justify-content:center;
    min-width:28px;height:20px;padding:0 5px;border-radius:4px;
    font-size:0.68rem;font-weight:700;background:#e0e7ff;border:1px solid #a5b4fc;color:#3730a3;">#${v}</span>`;

  const clusterHtml = (cluster, ci) => {
    const data = prepareTimetableDataForCluster(cluster.variantNums, globalData.variantsData);
    if (!data) return '';
    const vm = getTimetableViewModel(data);
    // Ukryj klaster składający się wyłącznie z tripów-zjazdów (brak widocznych kolumn)
    if (!vm.headers.length) return '';
    const vd = globalData.variantsData.variantDetails[cluster.variantNums[0]];
    const label = `${vd?.stopDetails[0]?.stop_name||'?'} → ${vd?.stopDetails.at(-1)?.stop_name||'?'}`;
    const range = cluster.variantNums.length === 1 ? `W#${cluster.variantNums[0]}` : `W#${cluster.variantNums[0]}–#${cluster.variantNums.at(-1)}`;
    return `<div class="cluster-block" style="margin-bottom:20px;">

                  padding:5px 10px;background:#f0f4ff;border-left:4px solid #3b82f6;border-radius:0 5px 5px 0;">
        <span style="font-size:0.72rem;font-weight:800;color:#1d4ed8;white-space:nowrap;">Klaster ${ci+1}</span>
        <span style="font-size:0.72rem;color:#374151;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(label)}</span>
        <span style="display:flex;gap:3px;align-items:center;flex-shrink:0;">${cluster.variantNums.map(badge).join('')}</span>
      </div>
      ${TimetableTemplates.table(vm)}

  container.innerHTML = `${TimetableTemplates.controls(getTimetableViewModel(globalData, clusters))}

  bindTimetableControls(container, false);
  container.querySelectorAll('.cluster-block').forEach(b => { bindTableEvents(b); bindTooltipBehavior(b); });
}



const TimetableConfig = {
  DAY_START_HOUR: 4
};

const StopTimetableService = {
  getTerminusId: (tripId, stopTimesIndex) => {
    const s = stopTimesIndex[tripId];
    return s?.length ? s[s.length - 1].stop_id : null;
  },

  resolveCalendar: (selectedDate) => {
    const nearbyHolidays = findNearbyHolidays(selectedDate);
    const holidayMap = new Map();
    nearbyHolidays.forEach(h => holidayMap.set(h.date, h));
    
    const weekdayDates = [];
    let d = parseGTFSDate(selectedDate) || new Date();
    for (let i=0; i<14 && weekdayDates.length<5; i++) {
      const ymd = formatDateToGTFS(d);
      if (d.getDay() >= 1 && d.getDay() <= 5 && !holidayMap.has(ymd)) {
        weekdayDates.push(ymd);
      }
      d.setDate(d.getDate() + 1);
    }

    const dateToServicesMap = new Map();
    weekdayDates.forEach(date => {
      dateToServicesMap.set(date, getServicesForDate(date));
    });

    const weekdayServicesSet = new Set();
    dateToServicesMap.forEach(srvList => srvList.forEach(id => weekdayServicesSet.add(id)));

    const satDate = findDateForDayOfWeek(6);
    const sunDate = findDateForDayOfWeek(0);

    const services = {
      weekday: weekdayServicesSet,
      sat: new Set(satDate ? getServicesForDate(satDate) : []),
      sun: new Set(sunDate ? getServicesForDate(sunDate) : []),
      holidays: new Map() 
    };

    const weekdayHolidays = nearbyHolidays.filter(h => {
      const hd = parseGTFSDate(h.date);
      if (hd.getDay() >= 1 && hd.getDay() <= 5) {
        services.holidays.set(h.date, new Set(getServicesForDate(h.date)));
        return true;
      }
      return false;
    });

    const allRelevantServices = new Set([...services.weekday, ...services.sat, ...services.sun]);
    services.holidays.forEach(s => s.forEach(id => allRelevantServices.add(id)));

    return { 
      weekdayDates, 
      dateToServicesMap,
      satDate, sunDate, holidayMap, weekdayHolidays, 
      services, allRelevantServices 
    };
  },

fetchDepartures: (stopIdsInput, calendarData, routeIds, gtfsData, filterDir) => {
    const buckets = { weekday: [], sat: [], sun: [], holidays: {} };
    calendarData.weekdayHolidays.forEach(h => buckets.holidays[h.date] = []);
    
    const targetIds = Array.isArray(stopIdsInput) ? stopIdsInput : [stopIdsInput];

    routeIds.forEach(rid => {
      const trips = gtfsData.tripsIndex[rid] || [];
      trips.forEach(trip => {
        if (!calendarData.allRelevantServices.has(trip.service_id)) return;
        if (filterDir !== undefined && String(trip.direction_id||'0') !== String(filterDir)) return;

        const stopTimes = gtfsData.stopTimesIndex[trip.trip_id];
        if (!stopTimes) return;

        const st = stopTimes.find(s => targetIds.includes(s.stop_id));
        if (!st) return;
        
        const lastId = stopTimes[stopTimes.length-1].stop_id;
        if (targetIds.includes(lastId)) return;

        const time = st.departure_time || st.arrival_time;
        if (!time) return;

        const entry = { time, trip, headsign: trip.trip_headsign || '' };
        const srv = trip.service_id;

        if (calendarData.services.weekday.has(srv)) buckets.weekday.push(entry);
        if (calendarData.services.sat.has(srv)) buckets.sat.push(entry);
        if (calendarData.services.sun.has(srv)) buckets.sun.push(entry);
        
        calendarData.weekdayHolidays.forEach(h => {
          if (calendarData.services.holidays.get(h.date)?.has(srv)) {
            buckets.holidays[h.date].push(entry);
          }
        });
      });
    });
    return buckets;
  },

  formatColumn: (departures, isWeekday, context, gtfsData) => {
    const { mainTerminusId, mainDestination, alternativeTermini, dateToServicesMap, weekdayDates, weekdayAnnotations } = context;
    const hourGroups = {};
    const minuteDaysMap = new Map();
    const fullWeekCount = weekdayDates.length;
    const majorityThreshold = fullWeekCount / 2;

    departures.forEach(d => {
      let [h, m] = d.time.split(':');
      h = parseInt(h, 10);
      
      if (h < TimetableConfig.DAY_START_HOUR) h += 24; 

      let tKey = '';
      const tId = StopTimetableService.getTerminusId(d.trip.trip_id, gtfsData.stopTimesIndex);
      
      if (tId && tId !== mainTerminusId) {
        let dest = d.headsign || gtfsData.stopsIndex[tId]?.stop_name || tId;
        if (dest !== mainDestination) {
          if (!alternativeTermini.has(dest)) {
            alternativeTermini.set(dest, String.fromCharCode('a'.charCodeAt(0) + alternativeTermini.size));
          }
          tKey = alternativeTermini.get(dest);
        }
      }

      if (isWeekday) {
        const key = `${h}:${m}:${tKey}`;
        if (!minuteDaysMap.has(key)) minuteDaysMap.set(key, new Set());
        
        weekdayDates.forEach((date, idx) => {
          const validServices = dateToServicesMap.get(date) || [];
          if (validServices.includes(d.trip.service_id)) {
            minuteDaysMap.get(key).add(idx);
          }
        });
      }

      if (!hourGroups[h]) hourGroups[h] = [];
      hourGroups[h].push({ m, tKey, key: `${h}:${m}:${tKey}` });
    });

    if (isWeekday) {
      const patterns = new Map();
      minuteDaysMap.forEach(days => {
        if (days.size > 0 && days.size <= majorityThreshold) { 
          const p = Array.from(days).sort().join(',');
          patterns.set(p, (patterns.get(p) || 0) + 1);
        }
      });

      const superscripts = ['⁰','¹','²','³','⁴','⁵','⁶','⁷','⁸','⁹'];
      Array.from(patterns.keys()).sort().forEach((p, i) => {
        if (!weekdayAnnotations.has(p)) {
          const days = p.split(',').map(Number);
          const sym = days.length === 1 
            ? superscripts[parseGTFSDate(weekdayDates[days[0]]).getDay()] 
            : superscripts[(i % 9) + 1];
          weekdayAnnotations.set(p, sym);
        }
      });
    }

    const result = {};
    Object.keys(hourGroups).forEach(h => {
      const unique = new Set();
      hourGroups[h].forEach(item => {
        let anno = '';
        if (isWeekday) {
          const days = minuteDaysMap.get(item.key);
          if (days && days.size > 0 && days.size <= majorityThreshold) {
            anno = weekdayAnnotations.get(Array.from(days).sort().join(',')) || '';
          }
        }
        unique.add(item.m + item.tKey + anno);
      });
      result[h] = Array.from(unique).sort();
    });
    return result;
  }
};

function prepareStopTimetableData(stopIdsInput) {
  const stopIds = Array.isArray(stopIdsInput) ? stopIdsInput : [stopIdsInput];
  const primaryId = stopIds[0];
  const stop = state.gtfsData.stopsIndex[primaryId];
  if (!stop) return null;

  const cal = StopTimetableService.resolveCalendar(state.selectedDate);

  const selectedGroup = state.selectedRoute
    ? state.gtfsData.logicalRoutes.find(g => g.members.some(m => m.route_id === state.selectedRoute.route_id))
    : null;

  const routeIds = (selectedGroup && state.selectedDirection !== undefined)
    ? selectedGroup.members.map(m => m.route_id)
    : state.gtfsData.routes.map(r => r.route_id);
    
  const filterDir = state.selectedRoute ? state.selectedDirection : undefined;

  let isTerminal = false;

  if (state.selectedRoute && filterDir !== undefined) {
    const routeTrips = routeIds.flatMap(id => state.gtfsData.tripsIndex[id] || []);

    const dirTrips = routeTrips.filter(t => String(t.direction_id || '0') === String(filterDir));
    
    if (dirTrips.length > 0) {
      let tripsStoppingHere = 0;
      let tripsContinuing = 0;

      const sample = dirTrips.slice(0, 50);

      for (const trip of sample) {
        const st = state.gtfsData.stopTimesIndex[trip.trip_id];
        if (!st || st.length === 0) continue;

        const match = st.find(s => stopIds.includes(s.stop_id));
        
        if (match) {
          tripsStoppingHere++;
          
          const lastStopId = st[st.length - 1].stop_id;
          
          if (!stopIds.includes(lastStopId)) {
            tripsContinuing++;
          }
        }
      }

      if (tripsStoppingHere > 0 && tripsContinuing === 0) {
        isTerminal = true;
      }
    }
  }

  const buckets = StopTimetableService.fetchDepartures(
    stopIds, cal, routeIds, state.gtfsData, filterDir
  );

  let mainDest = stop.stop_name;
  let mainTermId = null;
  
  if (state.selectedRoute) {
    try {
      const dirInfo = getAvailableDirections().find(d => String(d.id) === String(state.selectedDirection));
      if (dirInfo) mainDest = dirInfo.fullName || dirInfo.name;
    } catch(e){}

    const refTrip = buckets.weekday.find(d => d.headsign === mainDest)?.trip;
    if (refTrip) {
      mainTermId = StopTimetableService.getTerminusId(refTrip.trip_id, state.gtfsData.stopTimesIndex);
    }
  }

  const context = {
    mainTerminusId: mainTermId,
    mainDestination: mainDest,
    alternativeTermini: new Map(),
    weekdayAnnotations: new Map(),
    weekdayDates: cal.weekdayDates,
    dateToServicesMap: cal.dateToServicesMap 
  };

  const columns = [];
  
  columns.push({ 
    header: 'Dzień powszedni', 
    hours: StopTimetableService.formatColumn(buckets.weekday, true, context, state.gtfsData) 
  });
  
  const satHol = cal.holidayMap.get(formatDateToGTFS(cal.satDate ? parseGTFSDate(cal.satDate) : new Date()));
  const sunHol = cal.holidayMap.get(formatDateToGTFS(cal.sunDate ? parseGTFSDate(cal.sunDate) : new Date()));

  const extraColumns = [];

  if (cal.satDate) extraColumns.push({
    date: cal.satDate,
    header: satHol ? satHol.name : 'Sobota',
    hours: StopTimetableService.formatColumn(buckets.sat, false, context, state.gtfsData)
  });

  if (cal.sunDate) extraColumns.push({
    date: cal.sunDate,
    header: sunHol ? sunHol.name : 'Niedziela',
    hours: StopTimetableService.formatColumn(buckets.sun, false, context, state.gtfsData)
  });

  cal.weekdayHolidays.forEach(h => {
    extraColumns.push({
      date: h.date,
      header: h.name,
      hours: StopTimetableService.formatColumn(buckets.holidays[h.date], false, context, state.gtfsData)
    });
  });

  extraColumns.sort((a, b) => a.date.localeCompare(b.date));
  extraColumns.forEach(col => columns.push({ header: col.header, hours: col.hours }));

  return { 
    stopName: stop.stop_name, 
    routeName: state.selectedRoute?.route_short_name, 
    destination: mainDest, 
    columns, 
    context,
    isTerminal
  };
}

function getStopTimetableModalViewModel(data) {
  const { stopName, routeName, destination, columns, context, isTerminal } = data;
  
  const hourOrder = Array.from({length: 24}, (_, i) => i + TimetableConfig.DAY_START_HOUR);
  
const tableColumns = columns.map(col => {
    const validBlocks = hourOrder
      .map((h) => {
        const minutes = col.hours[h];
        if (!minutes || minutes.length === 0) return null;

        return {
          hourLabel: String(h % 24).padStart(2, '0'),
          minutesStr: minutes.join('  ')
        };
      })
      .filter(block => block !== null);

    const hourBlocks = validBlocks.map((block, i) => ({
      ...block,
      bgColor: i % 2 === 0 ? '#e9e9ed' : '#ffffff'
    }));

    return {
      header: col.header,
      hasContent: hourBlocks.length > 0,
      hourBlocks,
      emptyText: isTerminal ? 'Koniec trasy' : 'Brak kursów'
    };
  });

  const legendItems = [];
  const daysMap = ['niedziela','poniedziałek','wtorek','środa','czwartek','piątek','sobota'];

  if (context && context.weekdayAnnotations) {
    context.weekdayAnnotations.forEach((sym, key) => {
      const dayNames = key.split(',').map(idx => {
         if (!context.weekdayDates[idx]) return '?';
         const d = parseGTFSDate(context.weekdayDates[idx]);
         return d ? daysMap[d.getDay()] : '?';
      }).join(', ');
      legendItems.push({ symbol: sym, description: dayNames });
    });
  }
  
  if (context && context.alternativeTermini) {
    context.alternativeTermini.forEach((sym, name) => {
      legendItems.push({ symbol: sym, description: `do ${name}` });
    });
  }

  return {
    header: { routeName, stopName, destination },
    tableColumns,
    legendItems
  };
}

function renderStopTimetableModal(data) {
  if (!data) return;
  const modalId = 'stop-timetable-modal';
  const existing = document.getElementById(modalId);
  if (existing) document.body.removeChild(existing);

  const viewModel = getStopTimetableModalViewModel(data);

  const container = document.createElement('div');
  container.id = modalId;
  container.innerHTML = StopTimetableTemplates.layout(viewModel);
  document.body.appendChild(container);

  const overlay = container.firstElementChild; 
  if (overlay) {
    overlay.onclick = (e) => {
      if (e.target === overlay) document.body.removeChild(container);
    };
  }
}

function openStopTimetable(stopIdsStr) {
  if (!state.gtfsData || !state.selectedDate) return;
  const stopIds = String(stopIdsStr).split(',');
  
  const data = prepareStopTimetableData(stopIds);
  if (data) renderStopTimetableModal(data);
}
