const $ = (id) => document.getElementById(id);

const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));

function debounce(func, wait) {
  let timeout;
  return function executedFunction(...args) {
    const later = () => {
      clearTimeout(timeout);
      func(...args);
    };
    clearTimeout(timeout);
    timeout = setTimeout(later, wait);
  };
}


const MapService = {
  instances: new Map(),

  init(containerId, center = [51.94, 13.88], zoom = 11) {
    const container = document.getElementById(containerId);
    if (!container) return null;

    if (this.instances.has(containerId)) {
      const existingMap = this.instances.get(containerId);
      
      if (existingMap.getContainer() === container) {
        existingMap.setView(center, zoom, { animate: false });
        existingMap.invalidateSize();
        return existingMap;
      } else {
        this.destroy(containerId);
      }
    }

    if (container._leaflet_id) {
      container._leaflet_id = null;
    }

    container.innerHTML = '';
    
    try {
      const map = L.map(containerId).setView(center, zoom);
      
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        maxZoom: 19
      }).addTo(map);

      this.instances.set(containerId, map);
      return map;
    } catch (err) {
      console.error("Map init error:", err);
      if (container._leaflet_id) container._leaflet_id = null;
      return null;
    }
  },

  destroy(containerId) {
    if (this.instances.has(containerId)) {
      const map = this.instances.get(containerId);
      try {
        map.remove();
      } catch (e) {
        console.warn("Map remove warning:", e);
      }
      this.instances.delete(containerId);
    }
  },

  resetAll() {
    this.instances.forEach(map => {
        try { map.remove(); } catch(e) {}
    });
    this.instances.clear();
    
    window.leafletMap = null;
    window.leafletFeatureGroup = null;
    window.stopsListMap = null;
  }
};

const MapUtils = {

  createIcon(color, baseSize = 96) {
    const width = baseSize;
    const height = Math.round(baseSize * 1.41);
    
    const svgIcon = `
      <svg version="1.2" width="${width}" height="${height}" viewBox="0 0 21000 29700" preserveAspectRatio="xMidYMid" xmlns="http://www.w3.org/2000/svg">
        <path fill="#FFF" d="M10913 16775H8225v-5375h5375v5375h-2687z"/>
        <path fill="${color}" d="M10913 16098H8908v-4020h4009v4020h-2004z"/>
        <path fill="#FFF" d="M11460 13253c0 95-25 188-73 272-47 82-117 150-200 198-29 17-60 31-91 42v1520c0 31-9 62-25 89s-38 51-66 66c-28 16-61 24-92 24-32 0-63-8-91-24-28-15-51-39-67-66-15-27-24-58-24-89v-1520c-31-12-62-25-91-42-83-48-152-116-200-198-48-84-73-177-73-272s25-188 73-272c48-82 117-150 200-198 84-47 178-73 274-73s190 26 273 73c83 48 153 116 200 198 48 84 73 177 73 272z"/>
      </svg>
    `;

    return L.divIcon({
      html: svgIcon,
      className: 'custom-svg-icon',
      iconSize: [width, height],
      iconAnchor: [width / 2, height / 2],
      popupAnchor: [0, -Math.round(height * 0.15)]
    });
  },

  addMarker(container, lat, lon, { color = '#3b82f6', popupContent = null, onClick = null, size = 96 } = {}) {
    if (isNaN(lat) || isNaN(lon)) return null;

    const icon = this.createIcon(color, size);
    const marker = L.marker([lat, lon], { icon });

    if (popupContent) {
      marker.bindPopup(popupContent);
    }

    if (onClick) {
      marker.on('click', onClick);
    }

    if (container.addLayer) {
      container.addLayer(marker);
    } else {
      marker.addTo(container);
    }

    return marker;
  }
};

function escapeHtml(s) {

const keyCache = new Map();
function normalizeKey(k) {

      const normalized = KEY_ALIAS[key] || key.replace(/\s+/g,'_');

    }

const TimeUtils = {
	
  toMinutes(timeStr) {
    if (!timeStr) return 0;
    const parts = String(timeStr).split(':');
    const h = parseInt(parts[0] || '0', 10);
    const m = parseInt(parts[1] || '0', 10);
    return h * 60 + m;
  },

  fromMinutes(minutes) {
    if (minutes === undefined || minutes === null) return '';
    const h = Math.floor(minutes / 60);
    const m = minutes % 60;
    return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:00`;
  },

  formatForDisplay(timeStr) {
    if (!timeStr) return '<';
    const parts = String(timeStr).split(':');
    let hours = parseInt(parts[0] || '0', 10);
    const minutes = parts[1] || '00';
    
    if (hours >= 24) hours = hours % 24;
    
    return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
  },

  normalize(timeStr) {
    if (!timeStr) return "99:99:99";
    const str = String(timeStr);
    return str.match(/^\d:/) ? "0" + str : str;
  }
};

function parseGTFSDate(dateStr) {

  const d = parseInt(dateStr.substring(6, 8), 10);

}

function formatDateToGTFS(date) {

function compressCoordinates(coords) {
      if (!coords || coords.length === 0) return '';
      
      const deltas = [];
      let prevLat = 0, prevLon = 0;
      
      for (const [lat, lon] of coords) {
        const latInt = Math.round(lat * 1e6);
        const lonInt = Math.round(lon * 1e6);
        
        deltas.push(latInt - prevLat);
        deltas.push(lonInt - prevLon);
        
        prevLat = latInt;
        prevLon = lonInt;
      }
      
      return deltas.map(d => d.toString(36)).join(',');
    }

function decompressCoordinates(compressed) {
      if (!compressed) return [];
      
      const deltas = compressed.split(',').map(s => parseInt(s, 36));
      const coords = [];
      let lat = 0, lon = 0;
      
      for (let i = 0; i < deltas.length; i += 2) {
        lat += deltas[i];
        lon += deltas[i + 1];
        coords.push([lat / 1e6, lon / 1e6]);
      }
      
      return coords;
    }

function hashShapesData(shapesIndex) {
      const keys = Object.keys(shapesIndex).sort();
      const sample = keys.slice(0, 10).join(',') + keys.length;
      let hash = 0;
      for (let i = 0; i < sample.length; i++) {
        const char = sample.charCodeAt(i);
        hash = ((hash << 5) - hash) + char;
        hash = hash & hash;
      }
      return 'shapes_' + Math.abs(hash).toString(36);
    }

function cacheShapes(shapesIndex, simplified) {
      try {
        const cacheKey = hashShapesData(shapesIndex);
        
        const compressed = {};
        for (const [shapeId, coords] of Object.entries(simplified)) {
          compressed[shapeId] = compressCoordinates(coords);
        }
        
        const cacheData = {
          version: 2,
          timestamp: Date.now(),
          shapes: compressed
        };
        
        const jsonStr = JSON.stringify(cacheData);
        const originalSize = jsonStr.length;
        
        localStorage.setItem(cacheKey, jsonStr);
      } catch (e) {
        if (e.name === 'QuotaExceededError') {
          try {
            for (let i = 0; i < localStorage.length; i++) {
              const key = localStorage.key(i);
              if (key && key.startsWith('shapes_')) {
                localStorage.removeItem(key);
              }
            }
          } catch (e2) {
          }
        }
      }
    }

function loadCachedShapes(shapesIndex) {
      try {
        const cacheKey = hashShapesData(shapesIndex);
        const cached = localStorage.getItem(cacheKey);
        if (!cached) return null;
        
        const data = JSON.parse(cached);
        
        const age = Date.now() - data.timestamp;
        if (age > 30 * 24 * 60 * 60 * 1000) {
          localStorage.removeItem(cacheKey);
          return null;
        }
        
        const shapes = {};
        for (const [shapeId, shapeData] of Object.entries(data.shapes)) {
          shapes[shapeId] = data.version === 2
            ? decompressCoordinates(shapeData)
            : shapeData;
        }
        
        return shapes;
      } catch (e) {
        return null;
      }
    }

function getSqSegDist(p, p1, p2) {
      let x = p1[0], y = p1[1];
      let dx = p2[0] - x, dy = p2[1] - y;

      if (dx !== 0 || dy !== 0) {
        const t = ((p[0] - x) * dx + (p[1] - y) * dy) / (dx * dx + dy * dy);
        if (t > 1) {
          x = p2[0];
          y = p2[1];
        } else if (t > 0) {
          x += dx * t;
          y += dy * t;
        }
      }

      dx = p[0] - x;
      dy = p[1] - y;

      return dx * dx + dy * dy;
    }

function simplifyDouglasPeucker(points, tolerance) {
      if (!points || points.length <= 2) return points;
      const sqTolerance = tolerance * tolerance;
      
      const last = points.length - 1;
      const simplified = [points[0]];
      
      function simplifyStep(first, last) {
        let maxSqDist = sqTolerance;
        let index = 0;
        
        for (let i = first + 1; i < last; i++) {
          const sqDist = getSqSegDist(points[i], points[first], points[last]);
          if (sqDist > maxSqDist) {
            index = i;
            maxSqDist = sqDist;
          }
        }
        
        if (maxSqDist > sqTolerance) {
          if (index - first > 1) simplifyStep(first, index);
          simplified.push(points[index]);
          if (last - index > 1) simplifyStep(index, last);
        }
      }
      
      simplifyStep(0, last);
      simplified.push(points[last]);
      
      return simplified;
    }

function simplifyShapes(shapesIndex, tolerance = 0.0001) {
  const simplified = {};
  let totalOriginal = 0;
  let totalSimplified = 0;
  
  for (const [shapeId, points] of Object.entries(shapesIndex)) {
    totalOriginal += points.length;
    const simplifiedPoints = simplifyDouglasPeucker(points, tolerance);
    simplified[shapeId] = simplifiedPoints;
    totalSimplified += simplifiedPoints.length;
  }
  
  const reduction = totalOriginal > 0 
    ? Math.round((1 - totalSimplified / totalOriginal) * 100) 
    : 0;
  
  return simplified;
}

const TO_RAD = Math.PI / 180;
const TO_DEG = 180 / Math.PI;

function calculateBearing(lat1, lon1, lat2, lon2) {
  const dLon = (lon2 - lon1) * TO_RAD;
  const y = Math.sin(dLon) * Math.cos(lat2 * TO_RAD);
  const x = Math.cos(lat1 * TO_RAD) * Math.sin(lat2 * TO_RAD) -
            Math.sin(lat1 * TO_RAD) * Math.cos(lat2 * TO_RAD) * Math.cos(dLon);
  
  let bearing = Math.atan2(y, x) * TO_DEG;
  return (bearing + 360) % 360;
}

function tripSequenceScore(tripSeq, pattern) {
  const patternSet = new Set(pattern);
  const relevantStops = tripSeq.filter(stop => patternSet.has(stop));
  
  if (relevantStops.length === 0) return 0;
  
  let matchCount = 0;
  let idx = 0;
  
  for (let i = 0; i < relevantStops.length; i++) {
    const val = relevantStops[i];
    while (idx < pattern.length && pattern[idx] !== val) {
      idx++;
    }
    if (idx < pattern.length) {
      matchCount++;
      idx++;
    }
  }
  
  return matchCount / relevantStops.length;
}

function getTripStopSequence(tripId, stopTimesIndex) {
  const stopTimes = stopTimesIndex[tripId];
  if (!stopTimes || stopTimes.length === 0) return [];
  return stopTimes.map(st => st.stop_id);
}

function isCircularRoute(stopSequence) {
  if (!stopSequence || stopSequence.length < 2) return false;
  return stopSequence[0] === stopSequence[stopSequence.length - 1];
}

function bearingBetweenStops(stop1, stop2) {
  if (!stop1 || !stop2) return null;
  const lat1 = parseFloat(stop1.stop_lat), lon1 = parseFloat(stop1.stop_lon);
  const lat2 = parseFloat(stop2.stop_lat), lon2 = parseFloat(stop2.stop_lon);
  if ([lat1, lon1, lat2, lon2].some(isNaN)) return null;
  return calculateBearing(lat1, lon1, lat2, lon2);
}

function enrichRouteDirections(routeTrips, stopTimesIndex, stopsIndex) {
  const tripsToProcess = routeTrips.filter(t => 
    !t.direction_id || t.direction_id === ''
  );
  
  if (tripsToProcess.length === 0) return;
  
  const tripPatterns = tripsToProcess.map(trip => ({
    tripId: trip.trip_id,
    trip: trip,
    sequence: getTripStopSequence(trip.trip_id, stopTimesIndex)
  }));
  
  const validPatterns = tripPatterns.filter(p => p.sequence.length > 0);
  
  if (validPatterns.length === 0) {
    tripsToProcess.forEach(trip => trip.direction_id = '0');
    return;
  }
  
  const isCircular = validPatterns.every(p => isCircularRoute(p.sequence));
  if (isCircular) {
    tripsToProcess.forEach(trip => trip.direction_id = '0');
    return;
  }
  
  let refPattern = null;
  let maxLen = 0;
  
  for (const pattern of validPatterns) {
    if (pattern.sequence.length > maxLen) {
      maxLen = pattern.sequence.length;
      refPattern = pattern;
    }
  }
  
  if (!refPattern || refPattern.sequence.length === 0) {
    tripsToProcess.forEach(trip => trip.direction_id = '0');
    return;
  }
  
  const patternFwd = refPattern.sequence;
  const patternRev = [...patternFwd].reverse();
  
  let refBearing = null;
  if (stopsIndex && patternFwd.length >= 2) {
    refBearing = bearingBetweenStops(stopsIndex[patternFwd[0]], stopsIndex[patternFwd[patternFwd.length - 1]]);
  }
  
  tripsToProcess.forEach(trip => {
    const seq = getTripStopSequence(trip.trip_id, stopTimesIndex);
    
    if (!seq || seq.length === 0) {
      trip.direction_id = '0';
      return;
    }
    
    const scoreFwd = tripSequenceScore(seq, patternFwd);
    const scoreRev = tripSequenceScore(seq, patternRev);
    
    if (scoreFwd > scoreRev + 0.1) {
      trip.direction_id = '0';
    } else if (scoreRev > scoreFwd + 0.1) {
      trip.direction_id = '1';
    } else {
      if (refBearing !== null && stopsIndex && seq.length >= 2) {
        const tripBearing = bearingBetweenStops(stopsIndex[seq[0]], stopsIndex[seq[seq.length - 1]]);
        if (tripBearing !== null) {
          let diff = Math.abs(tripBearing - refBearing);
          if (diff > 180) diff = 360 - diff;
          trip.direction_id = diff < 90 ? '0' : '1';
        } else {
          trip.direction_id = '0';
        }
      } else {
        trip.direction_id = '0';
      }
    }
  });
}

async function enrichTripsWithDirectionIdAsync(trips, stopTimesIndex, stopsIndex, onProgress) {
  const tripsByRoute = {};
  
  for (const trip of trips) {
    if (!trip || !trip.trip_id) continue;
    
    const routeId = trip.route_id || 'unknown';
    if (!tripsByRoute[routeId]) {
      tripsByRoute[routeId] = [];
    }
    tripsByRoute[routeId].push(trip);
  }
  
  const routeIds = Object.keys(tripsByRoute);
  const CHUNK_SIZE = 500;
  
  for (let i = 0; i < routeIds.length; i += CHUNK_SIZE) {
    const chunk = routeIds.slice(i, i + CHUNK_SIZE);
    
    chunk.forEach(routeId => {
      enrichRouteDirections(tripsByRoute[routeId], stopTimesIndex, stopsIndex);
    });
    
    if (onProgress) {
      const percent = Math.round(((i + chunk.length) / routeIds.length) * 100);
      onProgress(i + chunk.length, routeIds.length, percent);
    }
    
    if (i + CHUNK_SIZE < routeIds.length) {
      await new Promise(resolve => setTimeout(resolve, 0));
    }
  }
}

function parseCSVLine(line) {
  if (!line) return [];
  
  if (!line.includes('"')) {
    return line.split(',');
  }
  
  const result = [];
  const chars = [];
  let inQuotes = false;
  
  for (let i = 0; i < line.length; i++) {
    const char = line[i];
    
    if (char === '"') {
      if (inQuotes && line[i + 1] === '"') {
        chars.push('"');
        i++;
      } else {
        inQuotes = !inQuotes;
      }
    } else if (char === ',' && !inQuotes) {
      result.push(chars.join(''));
      chars.length = 0;
    } else {
      chars.push(char);
    }
  }
  
  result.push(chars.join(''));
  
  if (inQuotes) {
    console.warn('parseCSVLine: Unclosed quotes in line:', line.substring(0, 50) + '...');
  }
  
  return result;
}

function parseCSV(text) {
  if (!text || typeof text !== 'string') {
    return [];
  }
  
  const normalized = text.indexOf('\r') !== -1 ? text.replace(/\r\n/g, '\n').replace(/\r/g, '\n') : text;
  const lines = normalized.split('\n');
  if (lines.length === 0) return [];
  
  const headerLine = lines[0].replace(/^\uFEFF/, '');
  const rawHeaders = parseCSVLine(headerLine);
  
  const headers = new Array(rawHeaders.length);
  for (let h = 0; h < rawHeaders.length; h++) {
    headers[h] = normalizeKey(rawHeaders[h].trim());
  }
  
  const headersLen = headers.length;
  const result = [];
  
  for (let i = 1; i < lines.length; i++) {
    const line = lines[i];
    if (line.length === 0 || (line.length === 1 && line.charCodeAt(0) === 10)) continue;
    
    const values = parseCSVLine(line);
    const row = Object.create(null); 
    
    for (let j = 0; j < headersLen; j++) {
      const key = headers[j];
      let val = values[j];
      
      if (val === undefined) {
        row[key] = '';
      } else {
        const len = val.length;
        if (len > 1 && val.charCodeAt(0) === 34 && val.charCodeAt(len - 1) === 34) {
          val = val.substring(1, len - 1);
        }
        row[key] = val.trim();
      }
    }
    
    result.push(row);
  }
  
  return result;
}

function parseStopTimesStreamWithWorker(zipFileEntry, onProgress) {
  return new Promise(async (resolve, reject) => {
    try {
      const arrayBuffer = await zipFileEntry.async('arraybuffer');
      const decoder = new TextDecoder('utf-8');
      
      let buffer = '';
      let lineCount = 0;
      let headers = null;
      const stopTimesIndex = Object.create(null);
      
      const PROGRESS_UPDATE_INTERVAL = 100000;
      const ESTIMATED_LINES_FOR_PROGRESS = 100000;
      const CHUNK_SIZE = 1024 * 1024;
     
      const getCol = (cols, idx) => {
        if (idx === -1 || idx >= cols.length) return '';
        let val = cols[idx];
        if (!val) return '';
        
        if (val[0] === '"' && val[val.length-1] === '"') {
          val = val.substring(1, val.length - 1);
        }
        
        if (val[0] === ' ' || val[val.length-1] === ' ') {
          return val.trim();
        }
        
        return val;
      };
      
      const processLine = (line) => {
        if (!line.trim()) return;
        
        if (!headers) {
          const rawHeaders = line.split(',').map(h => h.replace(/^"|"$/g, '').trim());
          headers = {
            tripIdx: -1,
            stopIdx: -1,
            seqIdx: -1,
            arrIdx: -1,
            depIdx: -1,
            pickupIdx: -1,
            dropoffIdx: -1
          };
          
          rawHeaders.forEach((h, i) => {
            const normalized = normalizeKey(h);
            if (normalized === 'trip_id') headers.tripIdx = i;
            else if (normalized === 'stop_id') headers.stopIdx = i;
            else if (normalized === 'stop_sequence') headers.seqIdx = i;
            else if (normalized === 'arrival_time') headers.arrIdx = i;
            else if (normalized === 'departure_time') headers.depIdx = i;
            else if (normalized === 'pickup_type') headers.pickupIdx = i;
            else if (normalized === 'drop_off_type') headers.dropoffIdx = i;
          });
          
          if (headers.tripIdx === -1 || headers.stopIdx === -1) {
            throw new Error('Brakuje wymaganych kolumn w stop_times.txt: trip_id lub stop_id');
          }
          return;
        }
        
        const cols = line.split(',');
        
        if (cols.length <= Math.max(headers.tripIdx, headers.stopIdx)) return;
        
        const tripId = getCol(cols, headers.tripIdx);
        const stopId = getCol(cols, headers.stopIdx);
        
        if (!tripId || !stopId) return;
        
        if (!stopTimesIndex[tripId]) {
          stopTimesIndex[tripId] = [];
        }
        
        stopTimesIndex[tripId].push({
          stop_id: stopId,
          arrival_time: getCol(cols, headers.arrIdx),
          departure_time: getCol(cols, headers.depIdx),
          stop_sequence: parseInt(getCol(cols, headers.seqIdx) || '0', 10),
          pickup_type: getCol(cols, headers.pickupIdx) || '0', 
          drop_off_type: getCol(cols, headers.dropoffIdx) || '0'
        });
        
        lineCount++;
        if (lineCount % PROGRESS_UPDATE_INTERVAL === 0) {
          state.loadingProgress = lineCount;
          if (onProgress) {
            onProgress(lineCount, Math.min(99, Math.round(lineCount / ESTIMATED_LINES_FOR_PROGRESS * 100)));
          }
        }
      };
      
      let offset = 0;
      while (offset < arrayBuffer.byteLength) {
        try {
          const chunkEnd = Math.min(offset + CHUNK_SIZE, arrayBuffer.byteLength);
          const chunk = new Uint8Array(arrayBuffer, offset, chunkEnd - offset);
          const isLastChunk = chunkEnd === arrayBuffer.byteLength;
          const text = decoder.decode(chunk, { stream: !isLastChunk });
          buffer += text;
          
          let newlineIndex;
          while ((newlineIndex = buffer.indexOf('\n')) !== -1) {
            const line = buffer.slice(0, newlineIndex); 
            processLine(line);
            buffer = buffer.slice(newlineIndex + 1);
          }
          
          offset = chunkEnd;
        } catch (err) {
          console.error('Error processing chunk at offset', offset, ':', err);
          offset = Math.min(offset + CHUNK_SIZE, arrayBuffer.byteLength);
        }
      }
      
      if (buffer.trim()) {
        try {
          processLine(buffer);
        } catch (err) {
          console.error('Error processing final buffer:', err);
        }
      }
      
      Object.keys(stopTimesIndex).forEach(tripId => {
        stopTimesIndex[tripId].sort((a, b) => a.stop_sequence - b.stop_sequence);
      });
      
      if (onProgress) onProgress(lineCount, 100);
      resolve(stopTimesIndex);
      
    } catch(err) {
      reject(err);
    }
  });
}

function parseShapesWithWorker(zipFileEntry, onProgress) {
      return new Promise(async (resolve, reject) => {
        try {
          const text = await zipFileEntry.async('string');
          
const workerCode = `
            ${getSharedWorkerCode()}
            
            function smartSplit(line) {
              if (!line.includes('"')) {
                return line.split(',');
              }
              
              const cols = [];
              let current = '';
              let inQuotes = false;

                  if (i + 1 < line.length && line[i+1] === '"') {

                  } else {

                  }
                } else if (char === ',' && !inQuotes) {

          worker.onmessage = function(ev) {
            const msg = ev.data;
            
            if (msg.type === 'progress') {
              if (onProgress) {
                onProgress(msg.processed, msg.percent);
              }
            } else if (msg.type === 'done') {
              cleanup();
              resolve(msg.shapesIndex);
            } else if (msg.type === 'error') {
              cleanup();
              reject(new Error(msg.message));
            }
          };
          
          worker.onerror = function(ev) {
            cleanup();
            reject(new Error(ev.message || 'Worker parse error'));
          };
          
          worker.postMessage({ text });
          
        } catch(err) {
          reject(err);
        }
      });
    }

async function unzipWithFflate(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        
        reader.onload = function(e) {
          try {
            const arrayBuffer = e.target.result;
            const uint8Array = new Uint8Array(arrayBuffer);
            
            fflate.unzip(uint8Array, (err, unzipped) => {
              if (err) {
                reject(new Error('Failed to decompress ZIP: ' + err.message));
                return;
              }
              
              const files = {};
              
              for (const [path, data] of Object.entries(unzipped)) {
                if (path.endsWith('/')) continue;
                
                files[path] = {
                  name: path,
                  _data: data,
                  async: function(type) {
                    return Promise.resolve().then(() => {
                      if (type === 'string') {
                        const decoder = new TextDecoder('utf-8');
                        return decoder.decode(this._data);
                      } else if (type === 'arraybuffer') {
                        return this._data.buffer.slice(this._data.byteOffset, this._data.byteOffset + this._data.byteLength);
                      } else if (type === 'uint8array') {
                        return this._data;
                      } else if (type === 'blob') {
                        return new Blob([this._data]);
                      }
                      return this._data;
                    });
                  }
                };
              }
              
              resolve({ files });
            });
          } catch (err) {
            reject(new Error('Error reading ZIP file: ' + err.message));
          }
        };
        
        reader.onerror = function() {
          reject(new Error('Failed to read file'));
        };
        
        reader.readAsArrayBuffer(file);
      });
    }

function findFile(filesObj, filename) {
      const lowerFilename = filename.toLowerCase();
      
      if (filesObj[filename]) {
        return filesObj[filename];
      }
      
      for (const path in filesObj) {
        const lowerPath = path.toLowerCase();
        
        if (lowerPath === lowerFilename || lowerPath.endsWith('/' + lowerFilename)) {
          return filesObj[path];
        }
      }
      
      return null;
    }

//═════════════════════
// GTFS IMPORT SERVICE
//═════════════════════

class GtfsLoaderService {
  constructor(file, callbacks) {
    this.file = file;
    this.onProgress = callbacks.onProgress || (() => {});
    this.timings = {
      totalStart: performance.now(),
      unzipStart: 0, unzipEnd: 0,
      parseStart: 0, parseEnd: 0,
      stopTimesStart: 0, stopTimesEnd: 0,
      shapesStart: 0, shapesEnd: 0,
      indexStart: 0, indexEnd: 0,
      enrichStart: 0, enrichEnd: 0
    };
    this.zipFiles = null;
    this.rawDatasets = {};
    this.indexes = {};
  }

  async run() {
    await this._stepUnzip();
    await this._stepParseCoreFiles();
    await this._stepParseHeavyFiles();
    await this._stepBuildIndexesAndEnrich();
    return this._stepFinalize();
  }

  async _timed(key, fn) {
    this.timings[`${key}Start`] = performance.now();
    await fn();
    this.timings[`${key}End`] = performance.now();
  }

  async _stepUnzip() {
    this.onProgress('Rozpakowywanie ZIP (fflate)...', 0);
    await this._timed('unzip', async () => {
      const zip = await unzipWithFflate(this.file);
      this.zipFiles = zip.files;
      
      const required = ['routes.txt', 'trips.txt', 'stop_times.txt', 'stops.txt'];
      const missing = required.filter(f => !findFile(this.zipFiles, f));
      if (missing.length > 0) {
        throw new Error(`Brakuje wymaganych plików GTFS: ${missing.join(', ')}`);
      }
    });
  }

async _stepParseCoreFiles() {
  this.onProgress('Przetwarzanie plików GTFS...', 0);
  await this._timed('parse', async () => {
    const getFile = (name) => findFile(this.zipFiles, name);
    const parseFile = (file) => file ? file.async('string').then(parseCSV) : Promise.resolve([]);

    const [routes, trips, stops, calendar, calendarDates, agencies, frequencies] = await Promise.all([
      parseFile(getFile('routes.txt')),
      parseFile(getFile('trips.txt')),
      parseFile(getFile('stops.txt')),
      parseFile(getFile('calendar.txt')),
      parseFile(getFile('calendar_dates.txt')),
      parseFile(getFile('agency.txt')),
      parseFile(getFile('frequencies.txt'))
    ]);

    this.rawDatasets = { routes, trips, stops, calendar, calendarDates, agencies, frequencies };
  });
}

async _stepParseHeavyFiles() {
  this.onProgress('Parsowanie stop_times (streaming)...', 0);
  let stopTimesIndex;
  await this._timed('stopTimes', async () => {
    const stopTimesFile = findFile(this.zipFiles, 'stop_times.txt');
    stopTimesIndex = await parseStopTimesStreamWithWorker(stopTimesFile, (rows, pct) => {
      this.onProgress(`Parsowanie stop_times: ${rows.toLocaleString()} wierszy`, pct);
    });
    if (this.rawDatasets.frequencies && this.rawDatasets.frequencies.length > 0) {
      this.onProgress('Generowanie kursów z frequencies.txt...', 0);
      
      const toSec = t => { const p=t.split(':'); return (+p[0])*3600 + (+p[1])*60 + (+p[2]||0); };
      const toHms = s => { const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60; 
        return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`; };

      const newTrips = [];
      const tripLookup = {};
      this.rawDatasets.trips.forEach(t => tripLookup[t.trip_id] = t);

      this.rawDatasets.frequencies.forEach((freq, fIdx) => {
        const origTrip = tripLookup[freq.trip_id];
        const origStops = stopTimesIndex[freq.trip_id];
        
        if (!origTrip || !origStops || !origStops.length) return;

        const headway = parseInt(freq.headway_secs);
        if (!headway) return;

        const startTime = toSec(freq.start_time);
        const endTime = toSec(freq.end_time);
        const baseStart = toSec(origStops[0].departure_time || origStops[0].arrival_time);
        const offsets = origStops.map(st => ({
          arr: toSec(st.arrival_time) - baseStart,
          dep: toSec(st.departure_time) - baseStart
        }));

        let current = startTime;
        let i = 0;
        while (current < endTime) {
          const newId = `${origTrip.trip_id}_frq${fIdx}_${i++}`;
          newTrips.push({ ...origTrip, trip_id: newId, exact_times: freq.exact_times || '0' });
          stopTimesIndex[newId] = origStops.map((st, idx) => ({
            ...st, trip_id: newId,
            arrival_time: toHms(current + offsets[idx].arr),
            departure_time: toHms(current + offsets[idx].dep)
          }));
          current += headway;
        }
      });
      this.rawDatasets.trips.push(...newTrips);
    }
    this.rawDatasets.stopTimesIndex = stopTimesIndex;
  });

  const shapesFile = findFile(this.zipFiles, 'shapes.txt');
  let shapesIndex = {};
  if (shapesFile) {
    this.onProgress('Parsowanie shapes.txt (streaming)...', 0);
    await this._timed('shapes', async () => {
      try {
        const rawShapes = await parseShapesWithWorker(shapesFile, (rows, pct) => {
          this.onProgress(`Parsowanie shapes: ${rows.toLocaleString()} punktów`, pct);
        });
        let simplified = loadCachedShapes(rawShapes);
        if (!simplified) {
          this.onProgress('Upraszczanie tras (Douglas-Peucker)...', 0);
          simplified = simplifyShapes(rawShapes, 0.0001);
          cacheShapes(rawShapes, simplified);
        }
        shapesIndex = simplified;
        for (const key of Object.keys(shapesIndex)) {
          shapesIndex[key] = shapesIndex[key].filter(pt => (Math.abs(pt[0]) > 0.5 || Math.abs(pt[1]) > 0.5));
        }
      } catch (err) {
        console.warn('Shapes parsing failed, continuing without shapes', err);
      }
    });
  }
  this.rawDatasets.shapesIndex = shapesIndex;
}

async _stepBuildIndexesAndEnrich() {
    this.onProgress('Budowanie indeksów...', 0);
    await this._timed('index', async () => {

    const stopsIndex = {}; 
    this.rawDatasets.stops.forEach(s => { if (s?.stop_id) stopsIndex[s.stop_id] = s; });

    const tripsIndex = {};
    this.rawDatasets.trips.forEach(t => { 
      if (!t || !t.route_id) return;
      if (!tripsIndex[t.route_id]) tripsIndex[t.route_id] = [];
      tripsIndex[t.route_id].push(t);
    });
    
    if (this.rawDatasets.calendar) {
        this.rawDatasets.calendar.forEach(cal => {
            if (cal.start_date) cal.start_date = normalizeDateStr(cal.start_date);
            if (cal.end_date) cal.end_date = normalizeDateStr(cal.end_date);
        });
    }

    const calendarDatesIndex = new Map();
    if (this.rawDatasets.calendarDates) {
      this.rawDatasets.calendarDates.forEach(cd => {
        if (!cd.date) return;
        
        const dateKey = normalizeDateStr(cd.date);
        
        if (!calendarDatesIndex.has(dateKey)) {
          calendarDatesIndex.set(dateKey, { added: new Set(), removed: new Set() });
        }
        const bucket = calendarDatesIndex.get(dateKey);
        
        const excType = String(cd.exception_type).trim();
        if (excType === '1') bucket.added.add(cd.service_id);
        else if (excType === '2') bucket.removed.add(cd.service_id);
      });
    }
	
    const agenciesIndex = {};
    this.rawDatasets.agencies.forEach(a => {
      if (a && (a.agency_id || a.agency_name)) {
        agenciesIndex[a.agency_id || a.agency_name] = a;
      }
    });

    this.onProgress('Generowanie brakujących direction_id...', 0);
    await this._timed('enrich', async () => {
      await enrichTripsWithDirectionIdAsync(
        this.rawDatasets.trips,
        this.rawDatasets.stopTimesIndex,
        stopsIndex,
        (processed, total, percent) => {
           this.onProgress(`Generowanie direction_id: ${processed}/${total} tras`, percent);
        }
      );
    });

    this.indexes = { stopsIndex, tripsIndex, agenciesIndex, calendarDatesIndex };
    }); // end _timed('index')
  }

  _stepFinalize() {
    const { routes } = this.rawDatasets;
    const { agenciesIndex } = this.indexes;

    const logicalRoutes = buildLogicalRoutes(routes, agenciesIndex, this.indexes.tripsIndex, this.rawDatasets.stopTimesIndex, this.indexes.stopsIndex);
    
    const t = this.timings;
    const elapsed = (key) => (t[`${key}End`] || 0) - (t[`${key}Start`] || 0);
    const metrics = {
      totalTime: (t.indexEnd || 0) - t.totalStart,
      unzipTime: elapsed('unzip'),
      parseTime: elapsed('parse'),
      stopTimesTime: elapsed('stopTimes'),
      shapesTime: elapsed('shapes'),
      indexTime: elapsed('index'),
      enrichTime: elapsed('enrich'),
      dataSummary: {
        routes: routes.length,
        trips: this.rawDatasets.trips.length,
        stops: this.rawDatasets.stops.length,
        stopTimes: Object.keys(this.rawDatasets.stopTimesIndex).length,
        shapes: Object.keys(this.rawDatasets.shapesIndex).length
      }
    };

    return {
      data: {
        ...this.rawDatasets,
        ...this.indexes,
        logicalRoutes
      },
      metrics
    };
  }
}

document.addEventListener('dragover', e => e.preventDefault());

function resetLoadingState(error = '') {
  state.loading = false;
  state.loadingStep = '';
  state.loadingProgress = 0;
  state.loadingProgressPercent = 0;
  state.error = error;
}

async function processGtfsFile(file) {
  if (!file) return;

  state.loading = true;
  resetMap();
  state.stopsListMapState = null;
  state.loadingStep = 'Odczytywanie archiwum GTFS...';
  state.loadingProgress = 0;
  state.loadingProgressPercent = 0;
  state.error = '';

  clearStopsSearchIndex();
  clearStopToRoutesCache();
  cachedGroupsArray = null;
  lastStopsDataHash = null;
  state.routeProfiles = {};
  state._servicesCache = {};
  state.stopDetailDepartures = [];
  if (typeof keyCache !== 'undefined') keyCache.clear();
  state.canonicalMasterLists = {};
  state.columnOrderCache = {};

  render();

  try {
    const loader = new GtfsLoaderService(file, {
      onProgress: (step, percent) => {
        state.loadingStep = step;
        state.loadingProgressPercent = percent || 0;
        render();
      }
    });

    const { data, metrics } = await loader.run();

    state.gtfsData = data;
    state.selectedRouteGroup = null;
    state.lastLoadMetrics = metrics;

    if (data.routes.length === 1) {
      state.selectedRoute = data.routes[0];
      const routeTrips = data.tripsIndex[state.selectedRoute.route_id] || [];
      if (routeTrips.length > 0) {
        state.selectedDirection = [...new Set(routeTrips.map(t => t.direction_id || '0'))][0];
      }
    }

    const dates = generateAvailableDates(data.calendar, data.calendarDates);
    state.availableDates = dates;

    if (dates.length > 0) {
      const today = new Date();
      const todayStr = formatDateToGTFS(today);

      let selectedDate = null;
      if (dates.some(d => d.value === todayStr)) {
        selectedDate = todayStr;
      } else {
        const earlierDates = dates.filter(d => d.value <= todayStr);
        if (earlierDates.length > 0) {
          selectedDate = earlierDates[earlierDates.length - 1].value;
        } else {
          selectedDate = dates[0].value;
        }
      }
      state.selectedDate = selectedDate;
    }

    resetLoadingState();
    render();

  } catch (err) {
    console.error(err);
    resetLoadingState('Błąd ładowania pliku GTFS: ' + err.message);
    render();
  }
}

function cancelParsing() {
  if (state.currentWorker) {
    try { state.currentWorker.terminate(); } catch(e){}
    state.currentWorker = null;
  }
  
  resetLoadingState('Parsowanie anulowane przez użytkownika');
  render();
}

//══════════════════════
// GTFS DATA PROCESSING
//══════════════════════

const _CANONICAL_EXACT = { 0:'tram', 1:'metro', 2:'rail', 3:'bus', 4:'ferry',
  5:'cable', 6:'gondola', 7:'funicular', 11:'trolleybus', 12:'monorail', 300:'rail' };
const _CANONICAL_RANGES = [
  [100, 200, 'rail'], [200, 300, 'coach'], [301, 500, 'metro'],
  [500, 600, 'ferry'], [700, 800, 'bus'], [800, 900, 'trolleybus'],
  [900, 1000, 'tram'], [1100, 1200, 'air'], [1300, 1400, 'cable']
];

function canonicalFromCode(t) {
  if (t === null || t === undefined || t === '') return null;
  const n = parseInt(t, 10);
  if (isNaN(n)) return null;
  if (n in _CANONICAL_EXACT) return _CANONICAL_EXACT[n];
  return _CANONICAL_RANGES.find(([lo, hi]) => n >= lo && n < hi)?.[2] ?? null;
}

function collectRouteType(route) {
  const reasons = [];
  if (!route || typeof route !== 'object') return { canonical: 'other', reasons: ['no-route'] };

  const rt = (route.route_type !== undefined && route.route_type !== '') ? route.route_type
           : (route.route_type_id !== undefined && route.route_type_id !== '') ? route.route_type_id
           : (route.type !== undefined && route.type !== '') ? route.type
           : '';

  if (rt !== '') {
    const byCode = canonicalFromCode(rt);
    if (byCode) {
      reasons.push(`code:${rt}->${byCode}`);
      return { canonical: byCode, reasons };
    } else {
      reasons.push(`code:${rt}`);
    }
  } else {
    reasons.push('no-code');
  }

  reasons.push('fallback:other');
  return { canonical: 'other', reasons: reasons };
}

function getRouteTypeMeta(routeType) {
  const t = (routeType === null || routeType === undefined || routeType === '') ? null : parseInt(routeType, 10);
  
  if (t !== null && typeof state !== 'undefined' && state.customRouteTypeMap && state.customRouteTypeMap[t]) {
    return state.customRouteTypeMap[t];
  }

  const catKey = (t !== null && typeof canonicalFromCode === 'function' ? canonicalFromCode(t) : null) || 'other';
  const base = CANONICAL_CATEGORIES[catKey] || CANONICAL_CATEGORIES.other;
  
  const override = (t !== null) ? ROUTE_OVERRIDES[t] : null;

  return {
    label: base.label,
    color: override?.color || base.color,
    weight: override?.weight || base.weight,
    iconSvg: base.iconSvg
  };
}

const getRCenter = (r, trIdx, stIdx, sIdx) => {
  const trips = trIdx[r.route_id] || [];
  if (!trips.length) return null;
  let lat = 0, lon = 0, c = 0;
  for (let i = 0; i < trips.length; i += Math.max(1, trips.length >> 4)) {
    const sts = stIdx[trips[i].trip_id];
    if (sts?.length) [sts[0], sts[sts.length-1]].forEach(st => {
      const s = sIdx[st.stop_id];
      if (s?.stop_lat) { lat += +s.stop_lat; lon += +s.stop_lon; c++; }
    });
  }
  return c ? { lat: lat/c, lon: lon/c } : null;
};

function buildLogicalRoutes(routes, agIdx, trIdx, stIdx, sIdx) {
  const entries = routes.filter(r => r).map(r => {
    const cat = collectRouteType(r).canonical || 'other';
    return {
      r,
      k: `${(r.agency_id||'').toLowerCase()}#${cat}#${(r.route_short_name||r.route_id||'').trim().toLowerCase()}`,
      geo: getRCenter(r, trIdx, stIdx, sIdx)
    };
  }).sort((a, b) => a.k.localeCompare(b.k));

  const groups = [];
  for (const e of entries) {
    const last = groups[groups.length - 1];
    const isClose = !last?.geo || !e.geo || (Math.abs(last.geo.lat - e.geo.lat) < 0.1 && Math.abs(last.geo.lon - e.geo.lon) < 0.1);
    
    if (last && last.k === e.k && isClose) {
      last.members.push(e.r);
      // Jeśli grupa nie miała jeszcze geo, użyj geo tego membera
      if (!last.geo && e.geo) last.geo = e.geo;
    } else {
      groups.push({
        id: e.k + '_' + groups.length, 
        agency_id: e.r.agency_id || '',
        route_short_name: e.r.route_short_name || e.r.route_id || '',
        canonical_type: e.k.split('#')[1],
        members: [e.r],
        k: e.k, geo: e.geo 
      });
    }
  }

  return groups.sort((a, b) => {
    const oA = CANONICAL_CATEGORIES[a.canonical_type]?.order ?? 999;
    const oB = CANONICAL_CATEGORIES[b.canonical_type]?.order ?? 999;
    return (oA - oB) || a.route_short_name.localeCompare(b.route_short_name, undefined, { numeric: true });
  });
}

function getLogicalRouteKeyFromGroup(group) {
  if (!group) return null;
  return group.id || (group.agency_id || '') + '::' + (group.route_short_name || '');
}

function generateAvailableDates(calendar, calendarDates) {
  const getDayOfWeek = (gtfsDate) => {
    const d = parseGTFSDate(gtfsDate);
    return d ? DAY_NAMES[d.getDay()] : null;
  };
  
  const incrementGTFSDate = (gtfsDate) => {
    const d = parseGTFSDate(gtfsDate);
    if (!d) return gtfsDate;
    d.setDate(d.getDate() + 1);
    return formatDateToGTFS(d);
  };

  const allPossibleDates = new Set();
  
  calendar.forEach(cal => {
    const start = normalizeDateStr(cal.start_date);
    const end = normalizeDateStr(cal.end_date);
    
    if (!start || !end) return;
    
    let current = start;
    let safety = 0;
    while (current <= end && safety < 365) { 
      const dayName = getDayOfWeek(current);
      if (dayName && cal[dayName] === '1') {
        allPossibleDates.add(current);
      }
      current = incrementGTFSDate(current);
      safety++;
    }
  });

  calendarDates.forEach(cd => {
    if (cd.exception_type === '1') {
      allPossibleDates.add(normalizeDateStr(cd.date));
    }
  });

  const validDates = [];

  const exceptionsMap = new Map();
  calendarDates.forEach(cd => {
    const date = normalizeDateStr(cd.date);
    if (!exceptionsMap.has(date)) {
      exceptionsMap.set(date, { added: new Set(), removed: new Set() });
    }
    const bucket = exceptionsMap.get(date);
    if (cd.exception_type === '1') bucket.added.add(cd.service_id);
    else if (cd.exception_type === '2') bucket.removed.add(cd.service_id);
  });
  allPossibleDates.forEach(dateStr => {
    const dayName = getDayOfWeek(dateStr);
    const activeServices = new Set();

    calendar.forEach(cal => {
      const start = normalizeDateStr(cal.start_date);
      const end = normalizeDateStr(cal.end_date);
      const srvId = cal.service_id;

      if (dateStr >= start && dateStr <= end && cal[dayName] === '1') {
        const ex = exceptionsMap.get(dateStr);
        if (!ex || !ex.removed.has(srvId)) {
          activeServices.add(srvId);
        }
      }
    });

    const ex = exceptionsMap.get(dateStr);
    if (ex) {
      ex.added.forEach(srvId => activeServices.add(srvId));
    }

    if (activeServices.size > 0) {
      validDates.push(dateStr);
    }
  });

  return validDates.sort().map(dateStr => {
    const date = parseGTFSDate(dateStr);
    if (!date) return { value: dateStr, label: dateStr };
    
    const dd = String(date.getDate()).padStart(2, '0');
    const mm = String(date.getMonth() + 1).padStart(2, '0');
    const yyyy = String(date.getFullYear());
    
    return { value: dateStr, label: `${dd}-${mm}-${yyyy}` };
  });
}
  
function getServicesForDate(dateStr) {
  if (!state.gtfsData) return [];
  
  if (!state._servicesCache) state._servicesCache = {};
  if (state._servicesCache[dateStr]) return state._servicesCache[dateStr];

  const getDayOfWeek = (gtfsDate) => {
    const y = parseInt(gtfsDate.substring(0, 4));
    const m = parseInt(gtfsDate.substring(4, 6)) - 1;
    const d = parseInt(gtfsDate.substring(6, 8));
    return new Date(y, m, d).getDay();
  };
  
  const dayOfWeek = DAY_NAMES[getDayOfWeek(dateStr)];
  const services = new Set();
  
  if (state.gtfsData.calendar) {
    state.gtfsData.calendar.forEach(cal => {
      if (dateStr >= cal.start_date && dateStr <= cal.end_date && cal[dayOfWeek] === '1') {
        services.add(cal.service_id);
      }
    });
  }
  
  if (state.gtfsData.calendarDatesIndex) {
    const exceptions = state.gtfsData.calendarDatesIndex.get(dateStr);
    if (exceptions) {
      if (exceptions.added.size > 0) {
        exceptions.added.forEach(sId => services.add(sId));
      }
      if (exceptions.removed.size > 0) {
        exceptions.removed.forEach(sId => services.delete(sId));
      }
    }
  } else if (state.gtfsData.calendarDates) {
    state.gtfsData.calendarDates.forEach(cd => {
      if (cd.date === dateStr) {
        if (cd.exception_type === '1') services.add(cd.service_id);
        else if (cd.exception_type === '2') services.delete(cd.service_id);
      }
    });
  }
  
  const result = Array.from(services);
  state._servicesCache[dateStr] = result; // Zapisz w cache
  return result;
}

function findDateForDayOfWeek(targetDayOfWeek) {
  if (!state.selectedDate) return null;
  
  const getDayOfWeek = (gtfsDate) => {
    const y = parseInt(gtfsDate.substring(0, 4));
    const m = parseInt(gtfsDate.substring(4, 6)) - 1;
    const d = parseInt(gtfsDate.substring(6, 8));
    return new Date(y, m, d).getDay();
  };
  
  const addDays = (gtfsDate, days) => {
    const y = parseInt(gtfsDate.substring(0, 4));
    const m = parseInt(gtfsDate.substring(4, 6)) - 1;
    const d = parseInt(gtfsDate.substring(6, 8));
    const date = new Date(y, m, d);
    date.setDate(date.getDate() + days);
    return formatDateToGTFS(date);
  };
  
  const currentDayOfWeek = getDayOfWeek(state.selectedDate);
  if (currentDayOfWeek === targetDayOfWeek) return state.selectedDate;
  
  for (let i = 1; i <= 7; i++) {
    const testDate = addDays(state.selectedDate, i);
    if (getDayOfWeek(testDate) === targetDayOfWeek) {
      return testDate;
    }
  }
  
  for (let i = 1; i <= 7; i++) {
    const testDate = addDays(state.selectedDate, -i);
    if (getDayOfWeek(testDate) === targetDayOfWeek) {
      return testDate;
    }
  }
  
  return null;
}

function calculateEaster(year) {
      const a = year % 19;
      const b = Math.floor(year / 100);
      const c = year % 100;
      const d = Math.floor(b / 4);
      const e = b % 4;
      const f = Math.floor((b + 8) / 25);
      const g = Math.floor((b - f + 1) / 3);
      const h = (19 * a + b - d - g + 15) % 30;
      const i = Math.floor(c / 4);
      const k = c % 4;
      const l = (32 + 2 * e + 2 * i - h - k) % 7;
      const m = Math.floor((a + 11 * h + 22 * l) / 451);
      const month = Math.floor((h + l - 7 * m + 114) / 31);
      const day = ((h + l - 7 * m + 114) % 31) + 1;
      return new Date(year, month - 1, day);
    }

const FIXED_HOLIDAYS_MMDD = [
  ['0101', 'Nowy Rok'], ['0102', 'Dzień po Nowym Roku'], ['0501', 'Święto Pracy'],
  ['0503', 'Święto Konstytucji 3 Maja'], ['0815', 'Wniebowzięcie Najświętszej Maryi Panny'],
  ['1101', 'Wszystkich Świętych'], ['1111', 'Święto Niepodległości'],
  ['1224', 'Wigilia'], ['1225', 'Boże Narodzenie'], ['1226', 'Drugi dzień Świąt Bożego Narodzenia'],
  ['1231', 'Sylwester']
];

function getPolishHolidays(year) {
      const holidays = FIXED_HOLIDAYS_MMDD.map(([mmdd, name]) => ({ date: `${year}${mmdd}`, name }));
      
      const easter = calculateEaster(year);
      
      const easterOffset = (days) => {
        const d = new Date(easter);
        d.setDate(easter.getDate() + days);
        return formatDateToGTFS(d);
      };

      holidays.push(
        { date: easterOffset(-3), name: 'Wielki Czwartek' },
        { date: easterOffset(-2), name: 'Wielki Piątek' },
        { date: easterOffset(0),  name: 'Wielkanoc' },
        { date: easterOffset(1),  name: 'Poniedziałek Wielkanocny' },
        { date: easterOffset(60), name: 'Boże Ciało' }
      );
      
      return holidays;
    }

function findNearbyHolidays(referenceDateStr) {

  const daysDiff = (date1, date2) => {
    const y1 = parseInt(date1.substring(0, 4));
    const m1 = parseInt(date1.substring(4, 6)) - 1;
    const d1 = parseInt(date1.substring(6, 8));
    const y2 = parseInt(date2.substring(0, 4));
    const m2 = parseInt(date2.substring(4, 6)) - 1;
    const d2 = parseInt(date2.substring(6, 8));
    
    const ms1 = new Date(y1, m1, d1).getTime();
    const ms2 = new Date(y2, m2, d2).getTime();
    return Math.floor((ms2 - ms1) / (1000 * 60 * 60 * 24));
  };
  
  const y = parseInt(referenceDateStr.substring(0, 4));
  const holidays = [
    ...getPolishHolidays(y),
    ...getPolishHolidays(y + 1)
  ];
  
  const nearby = [];
  holidays.forEach(holiday => {
    const diffDays = daysDiff(referenceDateStr, holiday.date);
    if (diffDays >= 0 && diffDays <= 7) {
      nearby.push({
        ...holiday,
        dateObj: parseGTFSDate(holiday.date),
        daysFromRef: diffDays
      });
    }
  });
  
  return nearby;
}

function getStationId(stopId, stopsIndex) {
  const stop = stopsIndex[stopId];
  
  if (stop && stop.parent_station && stop.parent_station !== '0' && stop.parent_station.trim() !== '') {
    return stop.parent_station.trim().toLowerCase();
  }

  let strId = String(stopId).trim();
  
  if (strId.includes('_')) {
    strId = strId.split('_')[0];
  }

  if (strId.includes(':')) {
     const parts = strId.split(':');
     if (parts.length >= 3) { 
         return parts.slice(0, 3).join(':').toLowerCase(); 
     }
  }

  if (stop && stop.stop_name) {
    return stop.stop_name.trim().toLowerCase();
  }

  return strId.toLowerCase();
}

const TAIL_KEYWORDS = ['zajezdnia','depot','betriebshof','vozovna','remise','garage','abstellanlage','werkstatt','hangar','base bus',
"et-1","et-2",'ph','pt','kazimierza wielkiego - toruńska','toruńska - kazimierza wielkiego','głogowska/hetmańska','franowo',
'straßenbahnhof','heiterblick','urbicher kreuz','heinrich-schütz-str','schleswiger str','straßenbahnamt','btf','trachenberger platz','albert-wolf-platz','trattendorfer straße',
'ljubljanica','selska','mandlova','ravnice','schlachthofstr','hotel golf','brożka','elektromontaż','łagiewniki','steyrergasse','don bosco/harter straße','kirche don bosco'];

function classifyTailTrips(allTrips, stopTimesIndex, stopsIndex, coreStationsSet) {
  const tailTripIds = new Set();
  const tailSequences = new Set();

  const stId = sid => getStationId(sid, stopsIndex);
  const isTechnical = st => String(st.pickup_type||'0') === '1' && String(st.drop_off_type||'0') === '1';
  const isKeyword = st => { const name = (stopsIndex[st.stop_id]?.stop_name||'').toLowerCase(); const match = TAIL_KEYWORDS.some(k => name.includes(k)); return match; };
  const getSorted = trip => (stopTimesIndex[trip.trip_id]||[]).slice().sort((a,b) => parseInt(a.stop_sequence||0)-parseInt(b.stop_sequence||0));
  // przystanek jest "rzadki" jeśli nie należy do core — jeśli należy, to pętla/wariant, nie zjazd
  const isRareEndpoint = st => !coreStationsSet || !coreStationsSet.has(stId(st.stop_id));

  allTrips.forEach(trip => {
    const stops = getSorted(trip);
    if (!stops.length) return;
    const first = stops[0], last = stops[stops.length-1];
    if ((isTechnical(first) || isKeyword(first)) && isRareEndpoint(first) ||
        (isTechnical(last)  || isKeyword(last))  && isRareEndpoint(last)) {
      tailTripIds.add(trip.trip_id);
      tailSequences.add(stops.map(s => stId(s.stop_id)).join(','));
    }
  });

  allTrips.forEach(trip => {
    if (tailTripIds.has(trip.trip_id)) return;
    const stops = getSorted(trip);
    if (stops.length < 3) return;
    const seq = stops.map(s => stId(s.stop_id));
    const seqStr = seq.join(',');
    const revStr = [...seq].reverse().join(',');
    const isSubset = s => s.includes(seqStr) || s.includes(revStr) || seqStr.includes(s) || revStr.includes(s);
    if ([...tailSequences].some(isSubset)) { tailTripIds.add(trip.trip_id); tailSequences.add(seqStr); }
  });

  return tailTripIds;
}

function getCurrentRouteProfile() {
  if (!state.selectedRoute || !state.gtfsData) return null;
  return buildRouteProfileForCurrentSelection();
}

function buildRouteProfileForCurrentSelection() {
  if (!state.selectedRoute || !state.gtfsData) return null;

  const dir = state.selectedDirection || '0';
  
  const key = state.selectedRouteGroup
    ? getLogicalRouteKeyFromGroup(state.selectedRouteGroup)
    : 'raw::' + (state.selectedRoute.route_id || '');
  if (!key) return null;

  if (state.routeProfiles[key] && state.routeProfiles[key][dir]) {
    return state.routeProfiles[key][dir];
  }

  const { stopTimesIndex, tripsIndex, stopsIndex } = state.gtfsData;

  const memberRoutes = state.selectedRouteGroup?.members ?? [state.selectedRoute];
  const allTripsAllDirs = memberRoutes.flatMap(r => tripsIndex[r.route_id] || []);
  const allTrips = allTripsAllDirs.filter(t => (t.direction_id || '0') === dir);
  if (!allTrips.length) return null;

  const graphData = _profileBuildGraphAndCore(allTrips, stopTimesIndex, stopsIndex);
  const tailTripIds = classifyTailTrips(allTripsAllDirs, stopTimesIndex, stopsIndex, graphData.coreStationsSet);
  
  const { nodeTypes } = _profileClassifyStations(
    allTrips,
    allTripsAllDirs,
    graphData.coreStationsSet,
    stopTimesIndex,
    stopsIndex,
    tailTripIds
  );

  const processedTrips = _profileProcessTrips(
    allTrips, 
    stopTimesIndex, 
    stopsIndex, 
    graphData.coreStops, 
    nodeTypes,
    tailTripIds
  );

  const profile = {
    key,
    direction: dir,
    tripCount: allTrips.length,
    coreStops: graphData.coreStops,
    nodeTypes,
    processedTrips,
    tailTripIds,
    version: 4,
  };

  if (!state.routeProfiles[key]) state.routeProfiles[key] = {};
  state.routeProfiles[key][dir] = profile;

  return profile;
}

function _profileBuildGraphAndCore(allTrips, stopTimesIndex, stopsIndex) {
  let edgeThreshold = 0.23;
  let nodeThreshold = 0.10;
  
  if (state.selectedRoute) {
      const rt = parseInt(state.selectedRoute.route_type, 10);
      const isRail = (rt === 2 || (rt >= 100 && rt <= 117) || rt === 300 || rt === 400);
      
      if (isRail || allTrips.length <= 21) {
          edgeThreshold = 0.00; 
          nodeThreshold = 0.00;
      }
  }

  const totalTripsCount = allTrips.length || 1;

  const stationToStopIds = new Map();
  const edgeCount = {};
  const edgeEndpoints = {};

  allTrips.forEach(trip => {
    const sts = (stopTimesIndex[trip.trip_id] || [])
      .filter(st => st && st.stop_id)
      .sort((a, b) => parseInt(a.stop_sequence || '0') - parseInt(b.stop_sequence || '0'));

    const stationIds = sts.map(st => {
      const sid = getStationId(st.stop_id, stopsIndex);
      if (!stationToStopIds.has(sid)) stationToStopIds.set(sid, new Set());
      stationToStopIds.get(sid).add(st.stop_id);
      return sid;
    });

    for (let i = 0; i < stationIds.length - 1; i++) {
      const key = stationIds[i] + '->' + stationIds[i+1];
      edgeCount[key] = (edgeCount[key] || 0) + 1;
      if (!edgeEndpoints[key]) edgeEndpoints[key] = { from: stationIds[i], to: stationIds[i+1] };
    }
  });

  const coreEdgesSet = new Set(
    Object.keys(edgeCount).filter(k => edgeCount[k] / totalTripsCount >= edgeThreshold)
  );

  const coreStationsSet = new Set();
  Object.entries(edgeCount).forEach(([k, count]) => {
    if (count / totalTripsCount >= nodeThreshold) {
      const { from, to } = edgeEndpoints[k];
      coreStationsSet.add(from);
      coreStationsSet.add(to);
    }
  });

  const coreStationsSeq = _findCorePathDFS(coreEdgesSet, edgeEndpoints);
  const coreStops = coreStationsSeq.flatMap(sid => Array.from(stationToStopIds.get(sid) || []));

  return { coreStations: coreStationsSeq, coreStops, coreStationsSet };
}

function _findCorePathDFS(coreEdgesSet, edges) {
    const adj = {};
    const inDeg = {};
    const nodesInCore = new Set();

    coreEdgesSet.forEach(k => {
        const e = edges[k];
        if (!adj[e.from]) adj[e.from] = [];
        adj[e.from].push(e.to);
        inDeg[e.to] = (inDeg[e.to] || 0) + 1;
        if (inDeg[e.from] === undefined) inDeg[e.from] = 0;
        nodesInCore.add(e.from);
        nodesInCore.add(e.to);
    });

    const starts = Object.keys(inDeg).filter(id => inDeg[id] === 0);
    const candidates = starts.length ? starts : Array.from(nodesInCore);

    let bestPath = [];
    const visited = new Set();

    function dfs(u, path) {
        path.push(u);
        visited.add(u);
        const nexts = adj[u] || [];
        if (!nexts.length) {
            if (path.length > bestPath.length) bestPath = [...path];
        } else {
            nexts.forEach(v => {
                if (!visited.has(v)) dfs(v, path);
                else if (path.length > bestPath.length) bestPath = [...path];
            });
        }
        path.pop();
        visited.delete(u);
    }

    candidates.forEach(startNode => dfs(startNode, []));
    return bestPath;
}

function _profileClassifyStations(allTrips, allTripsAllDirs, coreStopsSet, stopTimesIndex, stopsIndex, tailTripIds) {
  const passengerStations = new Set();
  allTripsAllDirs.forEach(trip => {
    const stops = (stopTimesIndex[trip.trip_id]||[]).slice().sort((a,b) => parseInt(a.stop_sequence||0)-parseInt(b.stop_sequence||0));
    if (!tailTripIds.has(trip.trip_id)) {
      stops.forEach(st => passengerStations.add(getStationId(st.stop_id, stopsIndex)));
    } else {
      let first = -1, last = -1;
      stops.forEach((st, i) => { if (coreStopsSet.has(getStationId(st.stop_id, stopsIndex))) { if (first === -1) first = i; last = i; } });
      if (first !== -1) for (let i = first; i <= last; i++) passengerStations.add(getStationId(stops[i].stop_id, stopsIndex));
    }
  });

  const result = {};
  allTrips.forEach(trip => {
    (stopTimesIndex[trip.trip_id]||[]).forEach(st => {
      if (coreStopsSet.has(getStationId(st.stop_id, stopsIndex))) result[st.stop_id] = 'core';
      else if (!passengerStations.has(getStationId(st.stop_id, stopsIndex))) result[st.stop_id] = result[st.stop_id] || 'tail';
      else if (result[st.stop_id] !== 'core') result[st.stop_id] = 'passenger';
    });
  });
  return { nodeTypes: result };
}

function _profileProcessTrips(allTrips, stopTimesIndex, stopsIndex, coreStops, nodeTypes, tailTripIds) {
    tailTripIds = tailTripIds || new Set();
    const processedTrips = {};
    const coreStationsSet = new Set(coreStops.map(sid => getStationId(sid, stopsIndex)));


    let isRail = false;
    if (state.selectedRoute) {
        const rt = parseInt(state.selectedRoute.route_type, 10);
        isRail = (rt === 2 || (rt >= 100 && rt <= 117) || rt === 300 || rt === 400);
    }

    const skipDepotDetection = allTrips.length <= 21;

    allTrips.forEach(trip => {
        const stops = stopTimesIndex[trip.trip_id] || [];
        const sortedStops = [...stops].sort((a,b) => parseInt(a.stop_sequence||'0')-parseInt(b.stop_sequence||'0'));

        let firstCoreIdx = -1;
        let lastCoreIdx = -1;
        
        if (!isRail && !skipDepotDetection) {
             for (let i = 0; i < sortedStops.length; i++) {
                if (coreStationsSet.has(getStationId(sortedStops[i].stop_id, stopsIndex))) {
                    if (firstCoreIdx === -1) firstCoreIdx = i;
                    lastCoreIdx = i;
                }
            }
        }

        const isTailTrip = tailTripIds.has(trip.trip_id);

        // przytnij tail tripy do granic core (firstCoreIdx..lastCoreIdx)
        let headCutoffIdx = (isTailTrip && !isRail && !skipDepotDetection && firstCoreIdx !== -1) ? firstCoreIdx : 0;
        let tailCutoffIdx = (isTailTrip && !isRail && !skipDepotDetection && lastCoreIdx !== -1) ? lastCoreIdx + 1 : sortedStops.length;

        // jeśli tail trip ma 0 lub 1 przystanek core — ukryj całość
        if (isTailTrip && !isRail && !skipDepotDetection && lastCoreIdx - firstCoreIdx < 1) {
            headCutoffIdx = tailCutoffIdx;
        }

        const pStops = [];
        
        for (let i = headCutoffIdx; i < tailCutoffIdx; i++) {
            const st = sortedStops[i];
            const pType = String(st.pickup_type||'0');
            const dType = String(st.drop_off_type||'0');
            
            if (pType === '1' && dType === '1') continue;

            const isOnDemand = (['2','3'].includes(pType) || ['2','3'].includes(dType));
            
            pStops.push({ ...st, isOnDemand });
        }

        processedTrips[trip.trip_id] = {
            pStops,
        };
    });

    return processedTrips;
}

function createTripMappings(sortedTrips, tripStopMaps, masterList) {
  return sortedTrips.map(trip => {
    const tripStops = tripStopMaps[trip.trip_id] || [];
    if (tripStops.length === 0) return {};

    const mapping = {};
    let lastMatchedRowIdx = -1;

    for (let tIdx = 0; tIdx < tripStops.length; tIdx++) {
      const currentTripStop = tripStops[tIdx];
      const sId = currentTripStop.stop_id;

      const candidates = [];
      for (let mIdx = lastMatchedRowIdx + 1; mIdx < masterList.length; mIdx++) {
        const row = masterList[mIdx];
        if ((row.stopIds && row.stopIds.includes(sId)) || row.id === sId) {
          candidates.push(mIdx);
        }
      }

      if (candidates.length === 0) continue;

      let chosenRowIdx;

      if (candidates.length === 1) {
        chosenRowIdx = candidates[0];
      } else {
        
        const nextTripStop = tripStops[tIdx + 1];
        let bestCandidate = candidates[0];
        let minTotalCost = Infinity;

        for (const candIdx of candidates) {
          const gapBack = candIdx - lastMatchedRowIdx;

          let gapFwd = 0;

          if (nextTripStop) {
            const nextSId = nextTripStop.stop_id;
            let nextStopFoundAtIdx = -1;
            
            for (let nextM = candIdx + 1; nextM < masterList.length; nextM++) {
              const row = masterList[nextM];
              if ((row.stopIds && row.stopIds.includes(nextSId)) || row.id === nextSId) {
                nextStopFoundAtIdx = nextM;
                break;
              }
            }

            if (nextStopFoundAtIdx !== -1) {
              gapFwd = nextStopFoundAtIdx - candIdx;
            } else {
              gapFwd = 9999; 
            }
          } 
          
          const cost = (gapBack * gapBack) + (gapFwd * gapFwd * 1.1);

          if (cost < minTotalCost) {
            minTotalCost = cost;
            bestCandidate = candIdx;
          }
        }
        chosenRowIdx = bestCandidate;
      }

      mapping[chosenRowIdx] = currentTripStop;
      lastMatchedRowIdx = chosenRowIdx;
    }

    return mapping;
  });
}

function getCanonicalKeyForCurrentSelection() {
  if (!state.selectedRoute) return null;
  
  let key;
  if (state.selectedRouteGroup) {
    key = getLogicalRouteKeyFromGroup(state.selectedRouteGroup);
  } else {
    key = 'raw::' + (state.selectedRoute.route_id || '');
  }
  return key;
}

function buildCanonicalMasterList(profile, allTrips, stopTimesIndex, stopsIndex) {
  if (!profile || !profile.coreStops || profile.coreStops.length === 0) return null;

  const stopTripMap = _buildStopTripMap(allTrips, stopTimesIndex);

  const coreSkeleton = _buildCoreSkeleton(profile.coreStops, stopTripMap, stopsIndex);

  const coreTripTracker = new Map();
  coreSkeleton.forEach(g => coreTripTracker.set(g.visitKey, new Set()));

  const segments = _segmentTrips(allTrips, coreSkeleton, stopTimesIndex, stopsIndex, coreTripTracker);

  return _assembleAndConsolidate(coreSkeleton, segments, stopsIndex, profile.nodeTypes, coreTripTracker, stopTimesIndex);
}

function _buildStopTripMap(allTrips, stopTimesIndex) {
  const map = new Map();
  allTrips.forEach(t => {
    const sts = stopTimesIndex[t.trip_id] || [];
    sts.forEach(st => {
      if (!map.has(st.stop_id)) map.set(st.stop_id, new Set());
      map.get(st.stop_id).add(t.trip_id);
    });
  });
  return map;
}

function _canSafeMergeGlobal(stopIdsA, stopIdsB, stopTripMap) {
  const tripsA = new Set();
  for (const sId of stopIdsA) {
    const t = stopTripMap.get(sId);
    if (t) t.forEach(tid => tripsA.add(tid));
  }
  for (const sId of stopIdsB) {
    const t = stopTripMap.get(sId);
    if (t) {
      for (const tid of t) {
        if (tripsA.has(tid)) return false; 
      }
    }
  }
  return true;
}

function _canSafeMergeExplicit(tripsInRowA, tripsInRowB) {
  for (const t of tripsInRowB) {
    if (tripsInRowA.has(t)) return false;
  }
  return true;
}


function _buildCoreSkeleton(rawCoreStops, stopTripMap, stopsIndex) {
  const skeleton = []; 
  const stationLastGroupIdx = new Map();

  rawCoreStops.forEach(stopId => {
    const sId = getStationId(stopId, stopsIndex);
    let addedToExisting = false;

    if (stationLastGroupIdx.has(sId)) {
      const lastIdx = stationLastGroupIdx.get(sId);
      const lastGroup = skeleton[lastIdx];
      
      const safeToMerge = _canSafeMergeGlobal([stopId], lastGroup.stopIds, stopTripMap);

      if (safeToMerge) {
        if (!lastGroup.stopIds.includes(stopId)) lastGroup.stopIds.push(stopId);
        addedToExisting = true;
      }
    }

    if (!addedToExisting) {
      const existingCount = skeleton.filter(g => g.stationId === sId).length;
      const visitCount = existingCount + 1;
      const visitKey = `${sId}_${visitCount}`;

      skeleton.push({
        visitKey: visitKey,
        stationId: sId,
        stopIds: [stopId],
        isCore: true
      });
      stationLastGroupIdx.set(sId, skeleton.length - 1);
    }
  });
  return skeleton;
}

function _processSegmentToBucket(targetMap, segmentStops, tripId) {
  if (segmentStops.length === 0) return;
  
  const signature = segmentStops.map(s => s.visitKey).join('|');
  
  if (!targetMap.has(signature)) {
    targetMap.set(signature, { 
      stops: segmentStops.map(s => ({ 
        visitKey: s.visitKey, 
        name: s.name, 
        stopIds: [s.stop_id],
        trips: new Set([tripId]) 
      }))
    });
  } else {
    const chunk = targetMap.get(signature);
    segmentStops.forEach((s, idx) => {
      if (chunk.stops[idx]) {
        if (!chunk.stops[idx].stopIds.includes(s.stop_id)) {
          chunk.stops[idx].stopIds.push(s.stop_id);
        }
        chunk.stops[idx].trips.add(tripId);
      }
    });
  }
}

function _segmentTrips(allTrips, skeleton, stopTimesIndex, stopsIndex, coreTripTracker) {
  const preCore = new Map();
  const postCore = new Map();
  const windows = skeleton.map(() => new Map());

  allTrips.forEach(trip => {
    const stopTimes = stopTimesIndex[trip.trip_id] || [];
    const sorted = [...stopTimes].sort((a, b) => parseInt(a.stop_sequence) - parseInt(b.stop_sequence));
    if (sorted.length === 0) return;

    const tripTracker = new Map();
    const tripStops = sorted.map(st => {
      const sId = getStationId(st.stop_id, stopsIndex);
      const count = (tripTracker.get(sId) || 0) + 1;
      tripTracker.set(sId, count);
      
      return {
        ...st,
        stationId: sId,
        visitKey: `local_${sId}_${count}`, 
        name: stopsIndex[st.stop_id]?.stop_name || st.stop_id
      };
    });

    let currentTripP = 0;
    const bestPos = new Array(skeleton.length);

    skeleton.forEach((group, coreIdx) => {
      for (let i = currentTripP; i < tripStops.length; i++) {
        if (group.stationId === tripStops[i].stationId) {
          bestPos[coreIdx] = i;
          if (!group.stopIds.includes(tripStops[i].stop_id)) group.stopIds.push(tripStops[i].stop_id);
          
          tripStops[i].visitKey = group.visitKey;
          
          if (coreTripTracker.has(group.visitKey)) {
            coreTripTracker.get(group.visitKey).add(trip.trip_id);
          }

          currentTripP = i + 1;
          break;
        }
      }
    });

    const firstMatchIdx = bestPos.findIndex(x => x !== undefined);
    const lastMatchIdx = bestPos.findLastIndex(x => x !== undefined);

    if (firstMatchIdx === -1) {
       _processSegmentToBucket(preCore, tripStops, trip.trip_id);
       return;
    }

    if (bestPos[firstMatchIdx] > 0) {
      const seg = tripStops.slice(0, bestPos[firstMatchIdx]);
      if (firstMatchIdx === 0) _processSegmentToBucket(preCore, seg, trip.trip_id);
      else _processSegmentToBucket(windows[firstMatchIdx - 1] || preCore, seg, trip.trip_id);
    }

    if (bestPos[lastMatchIdx] < tripStops.length - 1) {
      const seg = tripStops.slice(bestPos[lastMatchIdx] + 1);
      if (windows[lastMatchIdx]) _processSegmentToBucket(windows[lastMatchIdx], seg, trip.trip_id);
      else _processSegmentToBucket(postCore, seg, trip.trip_id);
    }

    for (let i = 0; i < skeleton.length - 1; i++) {
      if (bestPos[i] === undefined) continue;
      let nextCoreIdx = -1;
      for (let j = i + 1; j < skeleton.length; j++) {
        if (bestPos[j] !== undefined) { nextCoreIdx = j; break; }
      }
      if (nextCoreIdx === -1) break;

      const pos1 = bestPos[i];
      const pos2 = bestPos[nextCoreIdx];

      if (Math.abs(pos1 - pos2) > 1) {
        const start = Math.min(pos1, pos2) + 1;
        const end = Math.max(pos1, pos2);
        const seg = tripStops.slice(start, end);
        const targetWindowIdx = nextCoreIdx - 1;
        _processSegmentToBucket(windows[targetWindowIdx] || windows[i], seg, trip.trip_id);
      }
    }
  });

  return { preCore, postCore, windows };
}

function _assembleAndConsolidate(skeleton, segments, stopsIndex, nodeTypes, coreTripTracker) {
  const finalRowsRaw = [];

  const _smartFlattenBucket = (bucketMap, sortMode) => {
    let sequences = Array.from(bucketMap.values()).map(chunk => 
      chunk.stops.map(s => ({
        id: s.stopIds[0],
        visitKey: s.visitKey,
        name: s.name,
        stopIds: [...s.stopIds],
        trips: new Set(s.trips),
        nodeType: 'passenger'
      }))
    );

    if (sequences.length === 0) return;

    const isPre = (sortMode === 'pre');
    if (isPre) {
      sequences.forEach(seq => seq.reverse());
    }

    sequences.sort((a, b) => b.length - a.length);
    
    const masterList = [...sequences[0]];

    for (let i = 1; i < sequences.length; i++) {
      const seq = sequences[i];
      let masterIdx = 0;
      
      for (let j = 0; j < seq.length; j++) {
        const stop = seq[j];
        
        let foundAt = -1;
        for (let k = masterIdx; k < masterList.length; k++) {
          if (masterList[k].id === stop.id) {
            foundAt = k;
            break;
          }
        }

        if (foundAt !== -1) {
          stop.trips.forEach(t => masterList[foundAt].trips.add(t));
          stop.stopIds.forEach(sid => {
             if (!masterList[foundAt].stopIds.includes(sid)) {
               masterList[foundAt].stopIds.push(sid);
             }
          });
          masterIdx = foundAt + 1;
        } else {
          masterList.splice(masterIdx, 0, stop);
          masterIdx++;
        }
      }
    }

    if (isPre) {
      masterList.reverse();
    }

    masterList.forEach(stat => {
      finalRowsRaw.push({
        id: stat.id,
        visitKey: stat.visitKey,
        name: _cleanStopName(stat.name),
        stopIds: stat.stopIds,
        trips: stat.trips, 
        nodeType: 'passenger'
      });
    });
  };

  _smartFlattenBucket(segments.preCore, 'pre');

  skeleton.forEach((group, idx) => {
    const rawName = stopsIndex[group.stopIds[0]]?.stop_name || group.stationId;
    
    const realTrips = coreTripTracker.get(group.visitKey) || new Set();
    finalRowsRaw.push({
      id: group.stopIds[0],
      visitKey: group.visitKey,
      name: _cleanStopName(rawName),
      stopIds: [...group.stopIds],
      trips: new Set(realTrips),
      nodeType: (nodeTypes && nodeTypes[group.stopIds[0]]) || 'core'
    });

    if (segments.windows[idx]) {
      _smartFlattenBucket(segments.windows[idx], 'window');
    }
  });

  _smartFlattenBucket(segments.postCore, 'post');

  const consolidated = [];
  
  for (const row of finalRowsRaw) {
    let merged = false;

    for (let i = consolidated.length - 1; i >= 0; i--) {
      const target = consolidated[i];

      const isSameStation = (target.visitKey === row.visitKey) || (target.name === row.name);
      
      if (isSameStation) {
        if (_canSafeMergeExplicit(target.trips, row.trips)) {
          
          let blocked = false;
          for (let j = i + 1; j < consolidated.length; j++) {
             const obstacle = consolidated[j];
             for (const t of row.trips) {
               if (obstacle.trips.has(t)) {
                 blocked = true;
                 break;
               }
             }
             if (blocked) break;
          }

          if (!blocked) {
            row.stopIds.forEach(sid => { if (!target.stopIds.includes(sid)) target.stopIds.push(sid); });
            row.trips.forEach(tid => target.trips.add(tid));
            if (row.nodeType === 'core') target.nodeType = 'core';
            
            merged = true;
            break; 
          }
        }
        break; 
      }
    }

    if (!merged) {
      consolidated.push(row);
    }
  }

  return consolidated;
}

function _cleanStopName(name) {
  if (!name) return '';
  return name.replace(/\s+\d+[A-Za-z]?\s*$/, '').trim();
}

function ensureCanonicalMasterListForCurrentSelection() {
  const key = getCanonicalKeyForCurrentSelection();
  if (!key) return null;
  const dir = state.selectedDirection || '0';
  
  if (state.canonicalMasterLists[key] && state.canonicalMasterLists[key][dir]) {
    return state.canonicalMasterLists[key][dir];
  }

  const profile = getCurrentRouteProfile();
  if (!profile || !profile.coreStops || profile.coreStops.length === 0) return null;

  const { stopTimesIndex, tripsIndex, stopsIndex } = state.gtfsData;
  if (!stopTimesIndex || !tripsIndex || !stopsIndex) return null;

  let routeIds = [];
  if (state.selectedRouteGroup && Array.isArray(state.selectedRouteGroup.members)) {
    routeIds = state.selectedRouteGroup.members.map(r => r.route_id).filter(Boolean);
  } else if (state.selectedRoute) {
    routeIds = [state.selectedRoute.route_id];
  }

  if (!routeIds.length) return null;

  let allTrips = [];
  routeIds.forEach(rid => {
    const ts = tripsIndex[rid] || [];
    allTrips = allTrips.concat(ts);
  });

  allTrips = allTrips.filter(t => (t.direction_id || '0') === dir);
  if (!allTrips.length) return null;

  const rows = buildCanonicalMasterList(profile, allTrips, stopTimesIndex, stopsIndex);
  
  if (!rows) return null;

  if (!state.canonicalMasterLists[key]) {
    state.canonicalMasterLists[key] = {};
  }
  state.canonicalMasterLists[key][dir] = rows;

  return rows;
}

function invalidateCanonicalCacheForCurrentSelection() {
  const key = getCanonicalKeyForCurrentSelection();
  if (key && state.canonicalMasterLists[key]) {
    delete state.canonicalMasterLists[key];
  }
  state.columnOrderCache = {};
}

function buildClusterMasterList(variantNums, allVariantsData, tripStopMaps) {
  const si = state.gtfsData.stopsIndex;
  const { variantDetails, tripToVariant } = allVariantsData;

  const counts = Object.fromEntries(variantNums.map(v => [v, 0]));
  Object.values(tripToVariant).forEach(v => { if (counts[v] !== undefined) counts[v]++; });
  const sortedVariants = [...variantNums].sort((a, b) => counts[b] - counts[a]);
  const dominant = sortedVariants[0];

  const backbone = [];
  const seenStation = new Set();

  // FIX 3: stationId → index w backbone (O(1) zamiast findIndex O(n))
  const stationIdxMap = new Map();

  const makeRow = (sid, nodeType) => {
    const stId = getStationId(sid, si);
    const stop = si[sid];
    return {
      id: sid,
      name: _cleanStopName(stop?.stop_name || sid),
      stationId: stId,
      stopIds: [sid],
      trips: new Set(),
      nodeType
    };
  };

  // FIX 3: po każdym splice(pos, 0, row) przesuwa indeksy ≥ pos o +1
  const syncMapAfterSplice = (pos, newStId) => {
    for (const [stId, idx] of stationIdxMap) {
      if (idx >= pos) stationIdxMap.set(stId, idx + 1);
    }
    stationIdxMap.set(newStId, pos);
  };

  // Faza 1: kręgosłup z dominującego wariantu
  (variantDetails[dominant]?.stops || []).forEach(sid => {
    const stId = getStationId(sid, si);
    if (seenStation.has(stId)) return;
    seenStation.add(stId);
    stationIdxMap.set(stId, backbone.length);
    backbone.push(makeRow(sid, 'core'));
  });

  // Faza 2: wstawianie przystanków z pozostałych wariantów
  sortedVariants.slice(1).forEach(v => {
    const stops = variantDetails[v]?.stops || [];
    stops.forEach((sid, idx) => {
      const stId = getStationId(sid, si);

      // FIX 3: O(1) zamiast backbone.find O(n)
      if (seenStation.has(stId)) {
        const existingIdx = stationIdxMap.get(stId);
        if (existingIdx !== undefined) {
          const existing = backbone[existingIdx];
          if (!existing.stopIds.includes(sid)) existing.stopIds.push(sid);
        }
        return;
      }

      // Szukamy najbliższego poprzednika w backbone (wstecz po wariancie)
      let insertAfterIdx = -1;
      for (let j = idx - 1; j >= 0; j--) {
        const prevStId = getStationId(stops[j], si);
        const bIdx = stationIdxMap.get(prevStId); // FIX 3: O(1)
        if (bIdx !== undefined) { insertAfterIdx = bIdx; break; }
      }

      // Szukamy najbliższego następnika w backbone (wprzód po wariancie)
      let insertBeforeIdx = backbone.length;
      for (let j = idx + 1; j < stops.length; j++) {
        const nextStId = getStationId(stops[j], si);
        const bIdx = stationIdxMap.get(nextStId); // FIX 3: O(1)
        if (bIdx !== undefined) { insertBeforeIdx = bIdx; break; }
      }

      // FIX 1 + FIX 2: bezpieczne wyznaczenie pozycji wstawienia
      let pos;
      if (insertAfterIdx === -1 && insertBeforeIdx === backbone.length) {
        // FIX 1: brak obu kotwic — dołącz na koniec, nie na pozycję 0
        pos = backbone.length;
      } else if (insertAfterIdx === -1) {
        pos = insertBeforeIdx;
      } else if (insertBeforeIdx === backbone.length) {
        pos = insertAfterIdx + 1;
      } else if (insertAfterIdx + 1 <= insertBeforeIdx) {
        // Normalny przypadek: kotwice spójne
        pos = insertAfterIdx + 1;
      } else {
        // FIX 2: konflikt — kotwice sprzeczne (odwrócona kolejność w tym wariancie).
        // Ufamy kotwicy "po" (bliżej w przeszłości wariantu), klampujemy do zakresu.
        pos = Math.min(insertAfterIdx + 1, backbone.length);
      }

      seenStation.add(stId);
      backbone.splice(pos, 0, makeRow(sid, 'optional'));
      syncMapAfterSplice(pos, stId); // FIX 3: aktualizacja mapy po splice
    });
  });

  // Faza 3: dowiązanie wszystkich stop_id z tripStopMaps do wierszy backbone
  // FIX 4: O(1) lookup zamiast backbone.find O(n) dla każdego stop_id
  const allStopIds = new Set(Object.values(tripStopMaps).flatMap(sts => sts.map(s => s.stop_id)));
  allStopIds.forEach(sid => {
    const stId = getStationId(sid, si);
    const rowIdx = stationIdxMap.get(stId);
    if (rowIdx !== undefined) {
      const row = backbone[rowIdx];
      if (!row.stopIds.includes(sid)) row.stopIds.push(sid);
    }
  });

  return backbone;
}
