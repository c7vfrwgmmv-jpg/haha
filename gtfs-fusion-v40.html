function getCurrentView() {
      if (state.loading) return VIEW.LOADING;
      if (state.error) return VIEW.ERROR;
      if (!state.gtfsData) return VIEW.UPLOAD;
      
      if (!state.selectedRoute && state.showStopsView && state.selectedStop) {
        return VIEW.STOP_DETAIL;
      }
      if (!state.selectedRoute && state.showStopsView) {
        return VIEW.STOPS_LIST;
      }
      
      if (!state.selectedRoute) return VIEW.ROUTES_LIST;
      return VIEW.ROUTE_TIMETABLE;
    }
	
//══════════════════════════════
// UI: DATA PREPARATION HELPERS
//══════════════════════════════

const ViewData = {
   prepareStopDetail: (stop, selectedDate, filteredRouteIds) => {
    const dateSelectHtml = state.availableDates.length 
      ? `<select id="date-select-stop" class="rounded px-3 py-2 text-sm">
          ${state.availableDates.map(d => `<option value="${escapeHtml(String(d.value))}" ${String(d.value) === String(selectedDate) ? 'selected' : ''}>${escapeHtml(d.label)}</option>`).join('')}
         </select>` 
      : '';

    const { departures, routesAtStop } = computeStopDataForDate(stop.stop_id, selectedDate);
    state.stopDetailDepartures = departures;

    const routesArray = Array.from(routesAtStop.values()).sort((a, b) => {
      const na = String(a.route_short_name || a.route_id || '');
      const nb = String(b.route_short_name || b.route_id || '');
      return na.localeCompare(nb, undefined, { numeric: true, sensitivity: 'base' });
    });

    let filterButtonsHtml = `
      <button id="filter-all-routes" class="filter-btn-base px-2 py-1 rounded border border-black text-xs font-semibold ${filteredRouteIds.length === 0 ? 'bg-blue-500 text-white' : 'bg-white hover:bg-gray-50'}">
        <span>Wszystkie</span><span>(${departures.length})</span>
      </button>`;

    routesArray.forEach(route => {
      const isSelected = filteredRouteIds.includes(route.route_id);
      const meta = getRouteTypeMeta(route.route_type);
      const count = departures.filter(d => d.route.route_id === route.route_id).length;
      filterButtonsHtml += `
        <button class="route-filter-btn filter-btn-base px-2 py-1 rounded border border-black text-xs font-semibold ${isSelected ? 'bg-blue-500 text-white' : 'bg-white hover:bg-gray-50'}" 
          data-route-id="${escapeHtml(route.route_id)}" 
          style="border-left: 4px solid ${meta.color};">
          <span>${escapeHtml(route.route_short_name || route.route_id)}</span>
          <span>(${count})</span>
        </button>`;
    });

    const slotsPerRow = 16;
    const totalSlots = Math.ceil((routesArray.length + 1) / slotsPerRow) * slotsPerRow;
    const emptySlots = totalSlots - (routesArray.length + 1);
    for (let i = 0; i < emptySlots; i++) {
      filterButtonsHtml += `<div class="filter-btn-base px-2 py-1 rounded border-gray-300 bg-white"></div>`;
    }

    return {
      stopName: stop.stop_name,
      dateSelectHtml,
      filterButtonsHtml
    };
  },

  prepareRouteTimetable: (route, selectedDirection, selectedDate) => {
    const directions = getAvailableDirections();
    const dirA = directions[0], dirB = directions[1];
    const displayA = dirA?.fullName || dirA?.name || '';
    const displayB = dirB?.fullName || dirB?.name || '';
    const combinedAB = (displayA && displayB) ? `${displayA} → ${displayB}` : (displayA || displayB || '');
    
    const shortName = String(route.route_short_name || '').trim();
    const longName = String(route.route_long_name || '').trim();
    
    let rawTitle = combinedAB || longName;
    if (!rawTitle) {
      const selDir = directions.find(d => String(d.id) === String(selectedDirection)) || directions[0];
      rawTitle = selDir?.fullName || selDir?.name || route.route_id || '';
    }

    if (shortName && rawTitle) rawTitle = shortName + ' ' + rawTitle;
    
    if (shortName) {
      const escaped = shortName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const doubleRe = new RegExp('^' + escaped + '\\s+' + escaped + '(?:\\s|$)');
      if (doubleRe.test(rawTitle)) rawTitle = rawTitle.replace(new RegExp('^' + escaped + '\\s*'), '');
    }
    
    let cleanTitle = rawTitle || '';
    if (shortName) {
      const escapedShort = shortName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      cleanTitle = cleanTitle.replace(new RegExp('^' + escapedShort + '\\s*'), '');
    }

    const directionSelectHtml = directions.length > 1 
      ? `<select id="direction-select" style="max-width:160px;display:inline-block;height:40px;" class="border rounded px-3 text-sm">
          ${directions.map(dir => `<option value="${escapeHtml(String(dir.id))}" ${String(selectedDirection) === String(dir.id) ? 'selected' : ''}>${escapeHtml(dir.name)}</option>`).join('')}
         </select>`
      : '';

    const dateSelectHtml = state.availableDates.length 
      ? `<select id="date-select" style="width:auto;min-width:160px;display:inline-block;height:40px;" class="border rounded px-3 text-sm">
          ${state.availableDates.map(d => `<option value="${escapeHtml(String(d.value))}" ${String(d.value) === String(selectedDate) ? 'selected' : ''}>${escapeHtml(d.label)}</option>`).join('')}
         </select>` 
      : '';

    return {
      rawTitle,
      cleanTitle,
      badgeHtml: shortName ? `<span class="route-badge">${escapeHtml(shortName)}</span>` : '',
      directionSelectHtml,
      dateSelectHtml
    };
  }
};
	
//═══════════════════
// UI: EVENT BINDERS
//═══════════════════

const ViewEvents = {
bindGlobal: () => {
    $('file-input')?.addEventListener('change', handleFileUpload);
    $('file-input-header')?.addEventListener('change', handleFileUpload);
    $('cancel-parse')?.addEventListener('click', cancelParsing);
    

    $('back-button')?.addEventListener('click', () => {
      if (state.selectedRoute) {
        state.selectedRoute = null;
        resetMap();
      } 
      else if (state.selectedStop) {
        if (state.stopsListMapState?.expandedGroup) state.expandedStopGroup = state.stopsListMapState.expandedGroup;

        const mapToDestroy = state.stopDetailMapInstance;
        state.stopDetailMapInitialized = false;
        state.stopDetailMapLayers = {};
        state.stopDetailMapInstance = null;
        state.selectedStop = null;
        state.stopViewFilteredRoutes = [];

        render();
        setTimeout(() => { if (mapToDestroy) { try { mapToDestroy.remove(); } catch(e){} } }, 0);
        return;
      } 
      else if (state.showStopsView) {
        state.showStopsView = false;
        state.expandedStopGroup = null;
        state.stopsListMapState = null;
        state.stopsListSearchQuery = '';
        state.routesListScrollPosition = 0;
        resetMap();
      } 
      else if (!state.showStopsView) {
        state.showStopsView = true;
        state.routesListScrollPosition = 0;
        resetMap();
      }
      render();
    });
  },

  bindStopDetail: () => {
    $('date-select-stop')?.addEventListener('change', async (e) => {
      state.selectedDate = String(e.target.value);
      state.stopDetailDepartures = [];
      if (state.stopDetailMapInstance && state.stopDetailMapInitialized) {
          const map = state.stopDetailMapInstance;
          Object.values(state.stopDetailMapLayers).forEach(layer => map.removeLayer(layer));
          state.stopDetailMapLayers = {};
          state.stopDetailMapInitialized = false;
      }
      render(); 
    });

    const handleFilter = (routeId) => {
       if (routeId === 'all') {
         state.stopViewFilteredRoutes = [];
       } else {
         const idx = state.stopViewFilteredRoutes.indexOf(routeId);
         if (idx > -1) state.stopViewFilteredRoutes.splice(idx, 1);
         else state.stopViewFilteredRoutes.push(routeId);
       }
       filterStopDetailMapLayers(state.stopViewFilteredRoutes);
       updateRouteFilterButtons();
       updateDeparturesTable();
    };

    $('filter-all-routes')?.addEventListener('click', () => handleFilter('all'));
    document.querySelectorAll('.route-filter-btn').forEach(btn => {
      btn.addEventListener('click', () => handleFilter(btn.getAttribute('data-route-id')));
    });
    
    updateDeparturesTable(); 
    setTimeout(async () => {
       await renderStopDetailMap(state.selectedStop.stop_id, state.selectedDate, state.stopViewFilteredRoutes);
       filterStopDetailMapLayers(state.stopViewFilteredRoutes);
    }, 50);
  },

  bindStopsList: () => {
    $('view-mode-select-stops')?.addEventListener('change', (e) => {
      state.showStopsView = (e.target.value === 'stops');
      render();
    });
    renderStopsView();
  },

  bindRoutesList: () => {
    const captureScroll = () => {
      const container = document.getElementById('routes-list-container');
      if (container) state.routesListScrollPosition = container.scrollTop;
    };

    $('view-mode-select')?.addEventListener('change', (e) => {
      captureScroll(); 
      state.showStopsView = (e.target.value === 'stops');
      render();
    });
    
    $('route-group-select')?.addEventListener('change', (e) => {
      captureScroll(); 
      state.routeGroupMode = e.target.value || 'route_id';
      renderRouteTable();
      
      setTimeout(() => {
        const c = document.getElementById('routes-list-container');
        if (c && state.routesListScrollPosition > 0) c.scrollTop = state.routesListScrollPosition;
      }, 0);
    });
      
    renderRouteTable();
    
    if (state.routesListScrollPosition > 0) {
      setTimeout(() => {
        const c = document.getElementById('routes-list-container');
        if (c) c.scrollTop = state.routesListScrollPosition;
      }, 0);
    }
  },

  bindRouteTimetable: () => {
    const captureScroll = () => {
      const c = document.getElementById('route-view-container');
      if (c) state.timetableScrollPosition = c.scrollTop;
    };

    $('direction-select')?.addEventListener('change', (e) => {
      const v = String(e.target.value);
      if (v !== state.selectedDirection) {
        captureScroll(); 
        state.selectedDirection = v;
        invalidateCanonicalCacheForCurrentSelection();
        resetMap();
        render();
      }
    });

    $('date-select')?.addEventListener('change', (e) => {
      captureScroll(); 
      state.selectedDate = String(e.target.value);
      state.clusterModeEnabled = false;
      resetMap();
      render();
    });

    try { 
      renderTimetable();
      
      if (state.timetableScrollPosition > 0) {
        setTimeout(() => {
          const c = document.getElementById('route-view-container');
          if (c) c.scrollTop = state.timetableScrollPosition;
        }, 0);
      }
    } catch(e) { console.error(e); }
    updateMap().catch(()=>{});
  }
};

const ViewStrategies = {
  [VIEW.LOADING]: {
    getHtml: () => ViewTemplates.loading(),
    bindEvents: () => {}
  },
  [VIEW.ERROR]: {
    getHtml: () => ViewTemplates.error(state.error),
    bindEvents: () => {}
  },
  [VIEW.UPLOAD]: {
    getHtml: () => ViewTemplates.upload(),
    bindEvents: () => {}
  },
  [VIEW.STOP_DETAIL]: {
    getHtml: () => {
      const data = ViewData.prepareStopDetail(state.selectedStop, state.selectedDate, state.stopViewFilteredRoutes);
      return ViewTemplates.stopDetail(data);
    },
    bindEvents: () => ViewEvents.bindStopDetail()
  },
  [VIEW.STOPS_LIST]: {
    getHtml: () => ViewTemplates.stopsList(),
    bindEvents: () => ViewEvents.bindStopsList()
  },
  [VIEW.ROUTES_LIST]: {
    getHtml: () => ViewTemplates.routesList(state.routeGroupMode),
    bindEvents: () => ViewEvents.bindRoutesList()
  },
  [VIEW.ROUTE_TIMETABLE]: {
    getHtml: () => {
      const data = ViewData.prepareRouteTimetable(state.selectedRoute, state.selectedDirection, state.selectedDate);
      return ViewTemplates.routeTimetable(data);
    },
    bindEvents: () => ViewEvents.bindRouteTimetable()
  }
};

function renderImmediate() {
  const root = $('root');
  const currentView = getCurrentView();
  const strategy = ViewStrategies[currentView];

  if (!strategy) {
    console.error(`Brak strategii dla widoku: ${currentView}`);
    root.innerHTML = ViewTemplates.layout(ViewTemplates.error(`Błąd wewnętrzny: Nieznany widok ${currentView}`));
    ViewEvents.bindGlobal();
    return;
  }

  const contentHtml = strategy.getHtml();

  root.innerHTML = ViewTemplates.layout(contentHtml);

  ViewEvents.bindGlobal();

  strategy.bindEvents();
}

function render(force = false) {
  const now = Date.now();
  
  if (state.loading && !force) {
    if (now - lastRenderTime < RENDER_THROTTLE_MS) {
      return;
    }
  }
  
  lastRenderTime = now;
  renderImmediate();
}
